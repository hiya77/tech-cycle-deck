/* 7장 USB-C */
.usbc{gap:18px}
.ub-cols{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);gap:0;flex:1;min-height:0}
.ub{display:flex;flex-direction:column;gap:12px;border-radius:22px;padding:22px 26px;min-height:0}
.ub.before{background:var(--surface)}
.ub.after{background:var(--accent-soft)}
.ub header span{font-size:22px;font-weight:800}
.ub.after header span{color:var(--accent)}
.ub-ph{height:150px;border-radius:14px;flex:none}
.ub-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ub-rows li{display:flex;align-items:center;gap:12px;font-size:20px}
.ub-rows .ic{width:26px;height:26px;color:var(--ink-3)}
.ub-rows b{font-weight:600;min-width:130px}
.port{font-size:17px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;background:#8792A6}
.port.p1{background:#5F6B80}.port.p2{background:#3D475A}
.ub-res{margin:auto 0 0;font-size:20px;font-weight:700;color:var(--ink-2)}
.ub.after .ub-res{color:var(--accent)}
.ub-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--accent);text-align:center}
.ub-mid .ic{width:56px;height:56px}
.ub-mid span{font-size:17px;font-weight:700;line-height:1.3}
.hub{position:relative;display:grid;grid-template-columns:auto 80px 1fr;align-items:center}
.hub-c{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--accent);color:#fff;border-radius:16px;padding:12px 16px}
.hub-c .ic{width:30px;height:30px}
.hub-c b{font-size:17px;white-space:nowrap}
.hub-lines{width:80px;height:100%}
.hub-lines path{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:5 5;animation:dashflow 1.6s linear infinite}
.hub-d{list-style:none;margin:0;padding:0;display:grid;grid-template-rows:repeat(4,1fr);gap:4px}
.hub-d li{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;background:#fff;border-radius:10px;padding:4px 12px}
.hub-d .ic{width:22px;height:22px;color:var(--accent)}
.ub-law{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 20px;flex-wrap:wrap}
.ub-law .pill{background:var(--c-violet)}
.ul-r{font-size:21px}
.ul-t{list-style:none;margin:0 0 0 auto;padding:0;display:flex;gap:10px}
.ul-t li{display:flex;align-items:center;gap:10px;font-size:18px;background:color-mix(in srgb,var(--c-violet) 8%,white);border-radius:10px;padding:8px 14px;color:var(--ink-2)}
.ul-t .lw{font-family:var(--font-mono);font-weight:600;color:var(--c-violet)}

/* 8장 표 */
.sumt{width:100%;border-collapse:separate;border-spacing:0;font-size:24px}
.sumt th,.sumt td{padding:20px 26px;text-align:left;border-bottom:1px solid var(--line);line-height:1.4}
.sumt thead th{font-size:25px;font-weight:800;color:var(--c);border-bottom:3px solid var(--c)}
.sumt tbody th{font-size:20px;font-weight:700;color:var(--ink-3);width:220px}
.sumt tr.last td{font-weight:800;font-family:var(--font-display);background:var(--surface)}
.sumt tr.last td:first-of-type{color:var(--c-teal)}
.sumt tr.last td:last-of-type{color:var(--c-blue)}
.common{display:flex;align-items:center;gap:18px;margin-top:auto;background:var(--teal-soft);border-radius:18px;padding:22px 28px;color:var(--teal)}
.common .ic{width:30px;height:30px}
.common b{font-size:22px}
.common span{font-size:24px;font-weight:600;color:var(--ink)}

/* 9장 결론 */
.wrap{gap:20px}
.wr-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;flex:1;min-height:0}
.wr-l{display:flex;flex-direction:column;gap:16px;justify-content:center}
.side{display:flex;flex-direction:column;gap:8px;padding:22px 28px;border-radius:18px;background:color-mix(in srgb,var(--c) 9%,white)}
.sd-l{font-size:18px;font-weight:700;color:var(--c)}
.sd-h{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sd-s{font-size:18px;color:var(--ink-3)}
.wr-r{min-height:0;display:flex;align-items:center;justify-content:center}
.wr-r .loop{max-height:330px}
.dd{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:26px;row-gap:10px;align-items:center;padding:20px 28px;border-radius:18px;background:linear-gradient(100deg,color-mix(in srgb,var(--c-violet) 10%,white),color-mix(in srgb,var(--c-teal) 10%,white));border:1px solid color-mix(in srgb,var(--c-violet) 25%,white)}
.dd-l{grid-row:1 / span 2;font-size:19px;font-weight:800;color:var(--c-violet);writing-mode:horizontal-tb;background:#fff;border-radius:12px;padding:10px 14px}
.dd-chain{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:0}
.dd-chain li{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700;color:var(--ink-2);background:#fff;border-radius:999px;padding:8px 18px}
.dd-chain li:not(:last-child)::after{content:"";display:none}
.dd-chain li + li{margin-left:44px;position:relative}
.dd-chain li + li::before{content:"→";position:absolute;left:-34px;color:var(--ink-3);font-weight:700}
.dd-chain li.goal{background:var(--c-violet);color:#fff;font-size:24px;font-weight:800}
.dd-chain li.goal .ic{width:24px;height:24px}
.slide.play .dd.on .dd-chain li,.dd.on .dd-chain li{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * 220ms + 150ms)}
.dd-t{margin:0;font-size:21px;line-height:1.45;color:var(--ink);white-space:pre-line;font-weight:600}

/* 10장 마무리 */
.closing{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.cl-big{margin:0;font-size:120px;font-weight:800;letter-spacing:-.05em;background:linear-gradient(100deg,var(--ink) 30%,var(--c-teal) 70%,var(--c-blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.cl-sub{margin:16px 0 0;font-size:44px;font-weight:700;color:var(--ink-3);font-family:var(--font-mono)}
.cl-loop{display:flex;gap:16px;margin-top:40px}
.cl-loop i{width:18px;height:18px;border-radius:50%;background:var(--c-teal);animation:blink 1.5s ease-in-out infinite}
.cl-loop i:nth-child(2){background:var(--c-blue);animation-delay:.25s}
.cl-loop i:nth-child(3){background:var(--c-violet);animation-delay:.5s}
@keyframes blink{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:none}}
.cl-cred{position:absolute;left:0;right:0;bottom:0;margin:0;font-size:14px;line-height:1.5;color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){.lp-arc,.hub-lines path,.cl-loop i{animation:none}}

.slide.play .hl-item.rise{animation-fill-mode:backwards}
.ag-ic{position:absolute;right:26px;top:34px;color:var(--c);opacity:.18}
.ag-ic .ic{width:110px;height:110px}
.ub-ph{height:175px}
.ub{padding:20px 24px;gap:14px}
.ul-t li{font-family:var(--font-body)}
.ul-t .lw{font-family:var(--font-mono)}
.ub-law{flex-wrap:nowrap}
.sumt{font-size:26px}
.sumt th,.sumt td{padding:24px 26px}

/* ================= v2: 차분하고 고급스러운 톤 ================= */
:root{--ink:#0B1626;--ink-2:#465469;--ink-3:#8A94A6;--surface:#F6F7F9;--line:#E6E9EF;--line-2:#CDD3DD;
  --c-blue:#2453D6;--c-teal:#0E9F8E;--teal:#0B8A7C;--teal-soft:#E8F6F3;--c-violet:#4F5BD5;--c-orange:#E07A2F;--c-coral:#E5484D;--c-sky:#2A8FD3;
  --accent:#2453D6;--accent-ink:#2453D6;--accent-soft:#EDF2FD;--navy:#0B1626;--mint:#7FE0D2;
  --card-sh:0 1px 2px rgba(11,22,38,.04),0 12px 32px rgba(11,22,38,.07)}
.slide::before{display:none}
.eyebrow .no{background:transparent;color:var(--teal);border:1.5px solid color-mix(in srgb,var(--teal) 45%,white);padding:3px 11px}
.eyebrow [data-k]{color:var(--ink-3);font-weight:600;letter-spacing:.01em}
.lead{color:var(--ink)}
.s-foot{border-top-color:var(--line)}

/* 표지 · 전면 사진 */
.slide.t-cover,.slide.t-closing{background:var(--navy);padding:0}
.cv{position:relative;height:100%;color:#fff}
.cv-hero{position:absolute;top:0;right:0;bottom:0;width:58%}
.cv-ph{position:absolute;inset:0;background:#16233A}
.cv-ph img{object-position:25% 50%}
.cv-shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 0%,rgba(11,22,38,.82) 12%,rgba(11,22,38,.25) 36%,rgba(11,22,38,0) 60%),linear-gradient(0deg,rgba(11,22,38,.55),rgba(11,22,38,0) 30%);pointer-events:none}
.cv-cap{position:absolute;right:40px;bottom:40px;display:flex;gap:10px;align-items:center;font-size:17px;color:rgba(255,255,255,.88);background:rgba(11,22,38,.5);backdrop-filter:blur(8px);padding:9px 16px;border-radius:999px}
.cv-cap b{color:var(--mint);font-weight:700}
.cv-l{position:relative;z-index:2;width:54%;height:100%;box-sizing:border-box;padding:70px 0 60px 96px;display:flex;flex-direction:column}
.cv-eye{display:flex;gap:14px;align-items:center;font-size:20px;color:rgba(255,255,255,.62);font-weight:600}
.cv-eye .no{font-family:var(--font-mono);font-size:17px;color:var(--mint);border:1.5px solid rgba(127,224,210,.5);border-radius:999px;padding:3px 11px}
.t-cover .cover-q{font-size:62px;line-height:1.2;margin:34px 0 0;background:linear-gradient(100deg,#fff 50%,var(--mint) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%}
body.editing .t-cover .cover-q{color:#fff;background:none}
.cv-meta{margin-top:30px;display:flex;flex-direction:column;gap:8px;padding-left:20px;border-left:3px solid var(--mint)}
.t-cover .cover-title{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.02em}
.t-cover .cover-sub{font-size:21px;color:rgba(255,255,255,.62)}
.cv-tiles{margin-top:auto;display:flex;gap:16px}
.cv-tile{display:flex;flex-direction:column;gap:10px;width:220px}
.cv-tph{height:124px;border-radius:14px;background:#16233A}
.cv-tile span{font-size:17px;font-weight:600;color:rgba(255,255,255,.78)}
.t-cover .cover-by{margin-top:26px;font-size:21px;font-weight:700;color:#fff}

/* 목차 */
.ag{background:#fff;border:1px solid var(--line);box-shadow:var(--card-sh)}
.ag-n{font-size:56px;color:var(--c)}
.ag-ic{opacity:.12}
.ag-bar{height:4px}

/* 카드 · 행 */
.rcard{background:#fff;border:1px solid var(--line);box-shadow:var(--card-sh)}
.rc-ph{height:196px;border-bottom:1px solid var(--line)}
.rc-ic{width:40px;height:40px;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c)}
.rc-ic .ic{width:22px;height:22px}
.rc-ex{background:color-mix(in srgb,var(--c) 7%,white);border-color:color-mix(in srgb,var(--c) 18%,white)}
.slide.has-hl .rcard.hl{box-shadow:0 0 0 2px var(--c),0 22px 48px rgba(11,22,38,.14)}
.srow{box-shadow:var(--card-sh);border-color:var(--line)}
.sr-ph,.sr-ic{width:150px;height:112px;border-radius:12px}
.sr-ph{border:1px solid var(--line)}

/* 5장 그래프: 2010년 → 2025년 */
.bchart{background:#fff;border:1px solid var(--line);box-shadow:var(--card-sh);border-radius:22px;padding:26px 32px 24px;--p:0;--h:100%}
.bc-head{display:flex;flex-direction:column;gap:4px}
.bc-t{font-size:24px;font-weight:800}
.bc-u{font-size:16px;color:var(--ink-3)}
.bt-read{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.bt-track{flex:1;display:flex;align-items:center;gap:14px;font-size:21px;color:var(--ink-2);max-width:330px}
.bt-track b{font-weight:700;white-space:nowrap}
.bt-track .bt-b{color:color-mix(in srgb,var(--c-coral) calc(var(--p) * 100%),var(--ink-3))}
.bt-line{position:relative;flex:1;height:4px;border-radius:2px;background:var(--line)}
.bt-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 100%);border-radius:2px;background:var(--c-coral)}
.bt-dot{position:absolute;top:50%;left:calc(var(--p) * 100%);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid color-mix(in srgb,var(--c-coral) calc(var(--p) * 100%),#8B96A9);transform:translate(-50%,-50%);box-sizing:border-box}
.bt-price{display:flex;align-items:baseline;gap:8px}
.bt-p{font-family:var(--font-mono);font-size:54px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);transition:color .4s}
.bchart.hl .bt-p,.bchart.done .bt-p{color:var(--c-coral)}
.bt-price small{font-size:17px;color:var(--ink-3);font-weight:600}
.bt-plot{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:34px 30px 0;margin-bottom:38px;border-bottom:2px solid var(--line-2)}
.bt-ref{position:absolute;left:0;right:0;top:34px;border-top:2px dashed var(--line-2);opacity:var(--p)}
.bt-col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0}
.bt-bar{display:block;width:118px;border-radius:8px 8px 0 0}
.bt-col.ghost{opacity:var(--p)}
.bt-col.ghost .bt-bar{height:100%;background:#D5DBE4}
.bt-col.live .bt-bar{height:var(--h);background:#8B96A9;transition:background .4s}
.bchart.hl .bt-col.live .bt-bar,.bchart.done .bt-col.live .bt-bar{background:var(--c-coral)}
.bt-v{font-family:var(--font-mono);font-size:23px;font-weight:700;margin-bottom:8px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bchart.hl .bt-col.live .bt-v,.bchart.done .bt-col.live .bt-v{color:var(--c-coral)}
.bt-x{position:absolute;bottom:-34px;font-size:18px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.bt-badge{position:absolute;left:50%;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;color:var(--ink-3);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.bt-badge b{font-size:56px;font-weight:800;color:var(--c-coral);letter-spacing:-.03em;font-family:var(--font-display);line-height:1}
.bchart.done .bt-badge{opacity:1;transform:none}

/* 6장 사진 */
.pf-r{gap:18px}
.pf-photo{position:relative;height:180px;border-radius:16px;overflow:hidden;box-shadow:var(--card-sh)}
.pf-ph{position:absolute;inset:0}
.pf-photo span{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 12px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(0deg,rgba(11,22,38,.7),rgba(11,22,38,0))}
.keybox{margin-top:0}

/* 7장 · 8장 · 9장 */
.ub.before{background:var(--surface)}
.ub.after{background:var(--accent-soft)}
.ub-ph{border:1px solid var(--line);background:#fafafa}
.ub-law{box-shadow:var(--card-sh)}
.side{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);box-shadow:var(--card-sh)}
.dd{background:linear-gradient(100deg,color-mix(in srgb,var(--c-violet) 7%,white),color-mix(in srgb,var(--c-teal) 8%,white));border-color:color-mix(in srgb,var(--c-violet) 18%,white)}

/* 10장 마무리 */
.t-closing .closing{padding:0 96px;box-sizing:border-box}
.cl-line{display:block;width:64px;height:4px;border-radius:2px;background:var(--mint);margin-bottom:34px}
.t-closing .cl-big{background:linear-gradient(100deg,#fff 45%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
body.editing .t-closing .cl-big{color:#fff;background:none}
.t-closing .cl-sub{color:var(--mint);opacity:.85}
.t-closing .cl-cred{left:96px;right:96px;bottom:40px;color:rgba(255,255,255,.45)}

/* ================= 신제품 개발 덱 ================= */
/* 3장 혁신의 터널 */
.funnel{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:stretch}
.fn-l{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 30px;box-shadow:var(--card-sh);min-width:0}
.tunnel{width:100%;height:auto;flex:1;min-height:0}
.tn-shape{fill:color-mix(in srgb,var(--c-blue) 7%,white);stroke:color-mix(in srgb,var(--c-blue) 30%,white);stroke-width:2}
.tn-dot{fill:#AEB7C6;transform-box:fill-box}
.tn-dot.win{fill:var(--c-teal)}
.slide.play .tn-dot{animation:tnIn 1.2s cubic-bezier(.4,0,.2,1) both;animation-delay:calc(var(--k) * 90ms + 500ms)}
.slide.play .tn-dot.win{animation:tnWin 2.2s cubic-bezier(.4,0,.2,1) both;animation-delay:1.4s}
@keyframes tnIn{0%{opacity:0;transform:translateX(-30px)}50%{opacity:1}100%{opacity:.3;transform:translateX(var(--tx)) translateY(var(--ty))}}
@keyframes tnWin{0%{transform:none}100%{transform:translateX(500px)}}
.slide:not(.play) .tn-dot{opacity:.3;transform:translateX(var(--tx)) translateY(var(--ty))}
.slide:not(.play) .tn-dot.win{opacity:1;transform:translateX(500px)}
.tn-labels{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;color:var(--ink-3);font-weight:600}
.tn-labels b{color:var(--teal);font-size:26px}
.tn-note{display:flex;align-items:center;gap:10px;margin:4px 0 0;font-size:19px;color:var(--ink-2);background:var(--surface);border-radius:12px;padding:10px 14px}
.tn-note .ic{width:24px;height:24px;color:var(--ink-3)}
.fn-r{display:flex;flex-direction:column;gap:18px;justify-content:center;min-width:0}
.nw{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:20px 24px;box-shadow:var(--card-sh)}
.nw-ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c)}
.nw-ic .ic{width:28px;height:28px}
.nw b{display:block;font-size:27px;font-weight:800;letter-spacing:-.02em}
.nw span{font-size:20px;color:var(--ink-2)}
.fn-bottom{display:flex;gap:14px;align-items:center;margin-top:10px;background:var(--navy);color:#fff;border-radius:16px;padding:20px 24px;font-size:22px;font-weight:700;line-height:1.4}
.fn-bottom .ic{flex:none;width:28px;height:28px;color:var(--mint)}

/* 4장 6단계 */
.stagesb{gap:14px}
.sg-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.sg-g{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--c);font-size:21px;font-weight:800}
.sg-g i{display:block;width:100%;height:10px;border:2.5px solid var(--c);border-bottom:0;border-radius:8px 8px 0 0}
.sg-row{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px;flex:1;min-height:0}
.sg{position:relative;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:18px;padding:22px 20px;box-shadow:var(--card-sh);transition:opacity .3s,box-shadow .3s,transform .3s}
.sg-top{display:flex;justify-content:space-between;align-items:center}
.sg-n{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-size:22px;font-weight:700}
.sg-ic{color:var(--c);opacity:.5}
.sg-ic .ic{width:36px;height:36px}
.sg-name{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:6px}
.sg-act{align-self:flex-start;font-size:17px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 9%,white);border-radius:999px;padding:4px 12px}
.sg-goal{margin:auto 0 0;font-size:19px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.sg-arr{position:absolute;right:-22px;top:42px;width:22px;display:grid;place-items:center;color:var(--ink-3);z-index:2}
.sg-arr .ic{width:20px;height:20px}
.slide.has-hl .sg.hl{box-shadow:0 0 0 2px var(--c),0 22px 48px rgba(11,22,38,.14);transform:translateY(-4px)}

/* 5장 세부 절차 */
.detail{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center}
.dt-flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.dt-flow li{position:relative;display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;box-shadow:var(--card-sh)}
.dt-flow li + li::before{content:"";position:absolute;left:39px;top:-11px;height:10px;border-left:2px dashed var(--line-2)}
.dt-n{flex:none;width:42px;height:42px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:20px}
.dt-flow li:nth-child(n+5) .dt-n{background:var(--accent-soft);color:var(--accent)}
.dt-flow b{display:block;font-size:23px;font-weight:800}
.dt-flow span{font-size:17px;color:var(--ink-3)}
.mxw{display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 28px;box-shadow:var(--card-sh)}
.mx-t{font-size:21px;font-weight:800}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:20px;text-align:center}
.mx th,.mx td{padding:10px 8px;border-bottom:1px solid var(--line);transition:background .4s,color .4s}
.mx thead th{font-size:18px;color:var(--ink-3);font-weight:700}
.mx tbody th{text-align:left;font-weight:600;color:var(--ink-2)}
.mx td.w{color:var(--ink-3);font-family:var(--font-mono);font-size:18px}
.mx td{font-family:var(--font-mono)}
.mx tr.dots td,.mx tr.dots th{color:var(--ink-3);padding:4px}
.mx tr.tot th,.mx tr.tot td{border-bottom:0;font-weight:800;color:var(--ink)}
.mx tr.tot b{font-size:24px}
.mx.pick .bcol{background:color-mix(in srgb,var(--c-blue) 9%,white);color:var(--accent)}
.mx.pick thead .bcol{background:var(--accent);color:#fff;border-radius:10px 10px 0 0}
.mx.pick tr.tot .bcol b{color:var(--accent);font-size:28px}
.mx-pick{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--accent);font-weight:600;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.mx-pick .ic{width:26px;height:26px}
.mxw:has(.mx.pick) .mx-pick{opacity:1;transform:none}

/* 6·7장 사례 */
.casew{display:grid!important;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:40px;align-items:stretch}
.cs-l{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.cs-ph{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;box-shadow:var(--card-sh);border:1px solid var(--line);background:#fff}
.cs-img{position:absolute;inset:0}
.cs-cap{position:absolute;left:0;right:0;bottom:0;padding:28px 18px 12px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(0deg,rgba(11,22,38,.65),rgba(11,22,38,0))}
.cs-stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px}
.cs-stats>div{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--card-sh)}
.cs-stats b{font-family:var(--font-mono);font-size:36px;font-weight:700;color:var(--ink);line-height:1.1}
.cs-stats small{font-family:var(--font-body);font-size:18px;color:var(--ink-2);margin-left:3px}
.cs-stats>div>span{font-size:16px;color:var(--ink-3)}
.cs-lesson{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;font-size:20px;font-weight:700;line-height:1.4}
.cs-lesson .ic{flex:none;width:26px;height:26px;color:var(--mint)}
.cs-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.cs-row{display:grid;grid-template-columns:186px 112px minmax(0,1fr);align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--card-sh);flex:1;min-height:0;transition:opacity .3s,box-shadow .3s}
.cs-stage{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-size:17px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,white);border-radius:999px;padding:5px 13px;white-space:nowrap}
.cs-stage .ic{width:18px;height:18px}
.cs-when{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--ink-3)}
.cs-what{margin:0;font-size:20px;line-height:1.45;color:var(--ink)}
.cs-row.back{border-style:dashed;border-color:var(--c);background:color-mix(in srgb,var(--c) 4%,white)}
.slide.has-hl .cs-row.hl{box-shadow:0 0 0 2px var(--c),0 18px 40px rgba(11,22,38,.12)}

/* 9장 결론 */
.concl{gap:30px;justify-content:center}
.cn-chainw{display:flex;flex-direction:column;gap:6px}
.cn-chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.cn-chain li{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 10px;box-shadow:var(--card-sh);font-size:21px;font-weight:800;text-align:center;letter-spacing:-.02em}
.cn-chain li + li::before{content:"→";position:absolute;left:-16px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:700;font-size:16px}
.cn-n{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-size:17px}
.slide.play .cn-chain li{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * 120ms + 300ms)}
.cn-back{position:relative;height:48px;color:var(--c-orange)}
.cn-back svg{position:absolute;inset:0 0 8px;width:100%;height:40px;overflow:visible}
.cn-back path{fill:none;stroke:var(--c-orange);stroke-width:2.5;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.cn-back>span{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--bg);padding:0 14px;font-size:19px;font-weight:700}
.cn-back .ic{width:22px;height:22px}
.cn-pts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.cn-p{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:18px;padding:22px 24px;box-shadow:var(--card-sh)}
.cn-pn{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:19px}
.cn-p b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.cn-p span{font-size:19px;line-height:1.5;color:var(--ink-2)}
.cn-pts.on .cn-p{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * 180ms)}
@media (prefers-reduced-motion: reduce){.slide.play .tn-dot,.slide.play .cn-chain li,.cn-pts.on .cn-p{animation:none}}
.stagesb{justify-content:center}
.sg-row{flex:none;height:440px}
.sg-ic{opacity:.85}
.sg-ic .ic{width:40px;height:40px}
.sg-goal{font-size:20px}
.tn-dot.win{r:13}
/* 폴드 세대별 개선 */
.evolve{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:stretch}
.ev-chart{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--card-sh);padding:24px 28px 20px;display:flex;flex-direction:column}
.ev-bars{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:14px;min-height:0}
.ev-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0;transition:opacity .3s}
.ev-mm{font-family:var(--font-mono);font-size:21px;font-weight:800;color:var(--c);margin-bottom:6px}
.ev-base .ev-mm{color:var(--ink-2)}
.ev-bar{width:100%;flex:none;height:calc(var(--h) * 3.6px);max-height:360px;display:flex;align-items:flex-end}
.ev-bar i{display:block;width:100%;height:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,white),var(--c));transform-origin:bottom;animation:evGrow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--k) * .09s)}
.ev-base .ev-bar i{background:repeating-linear-gradient(135deg,#C9D0DB 0 6px,#DCE1E8 6px 12px)}
.slide:not(.is-active) .ev-bar i{animation:none}
@keyframes evGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ev-name{margin-top:10px;font-size:17px;font-weight:800;white-space:nowrap}
.ev-sub{font-size:14px;color:var(--ink-3);white-space:nowrap}
.ev-r{display:flex;flex-direction:column;gap:14px;min-height:0}
.ev-fix{flex:1;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:16px 22px;box-shadow:var(--card-sh);display:flex;flex-direction:column;justify-content:center;gap:6px;transition:opacity .3s,box-shadow .3s}
.ev-top{display:flex;align-items:center;gap:12px}
.ev-tag{font-size:17px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,white);border-radius:999px;padding:5px 13px;white-space:nowrap}
.ev-who{font-size:16px;font-weight:700;color:var(--ink-3)}
.ev-t{margin:0;font-size:21px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.slide.has-hl .ev-fix.hl{box-shadow:0 0 0 2px var(--c),0 18px 40px rgba(11,22,38,.12)}
.slide.has-hl .ev-base{opacity:.32}
/* v3: 강의자료 기준 수정 */
.tunnel{width:100%;height:auto;display:block}
.tn-node{fill:color-mix(in srgb,var(--c-blue) 55%,white);transform-box:fill-box;transform-origin:center}
.tn-node:last-of-type{fill:var(--c-teal)}
.slide.play .tn-node{animation:tnPop .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 260ms + 400ms)}
@keyframes tnPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.tn-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tn-steps li{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.tn-steps li+li::before{content:"→";position:absolute;left:-10px;top:4px;color:var(--ink-3);font-size:20px}
.tn-steps b{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--ink)}
.tn-steps li:last-child b{color:var(--teal)}
.tn-steps span{font-size:18px;color:var(--ink-2)}
.slide.play .tn-steps li{animation:tnPop .5s ease both;animation-delay:calc(var(--k) * 260ms + 500ms)}
.fn-l{justify-content:space-between}
.sg-note{margin:0 0 6px;font-size:17px;color:var(--ink-3);text-align:center}
.sg-row{height:420px}
.mx-note,.mx-calc{margin:0;font-size:17px;color:var(--ink-2)}
.mx-calc{font-family:var(--font-mono);font-size:16px;color:var(--ink-3)}
.cs-rw{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.cs-rw .cs-steps{flex:1;min-height:0}
.cs-caveat{display:flex;align-items:center;gap:8px;margin:0;font-size:16px;color:var(--ink-3);line-height:1.4}
.cs-caveat .ic{flex:none;width:20px;height:20px}
/* 왜 신제품을 만드는가 */
.why{display:flex!important;flex-direction:column;gap:22px}
.wy-cards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:28px;min-height:0}
.wy-c{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:20px;padding:24px 28px;box-shadow:var(--card-sh);display:flex;flex-direction:column;gap:14px;transition:opacity .3s,box-shadow .3s}
.wy-top{display:flex;align-items:center;gap:14px}
.wy-h{font-size:30px;font-weight:800;letter-spacing:-.02em}
.wy-q{margin:0;padding:12px 16px;border-left:3px solid color-mix(in srgb,var(--c) 45%,white);background:var(--surface);border-radius:0 12px 12px 0}
.wy-q p{margin:0 0 6px;font-size:20px;line-height:1.5;color:var(--ink)}
.wy-q cite{font-style:normal;font-size:15px;color:var(--ink-3)}
.slide.has-hl .wy-c.hl{box-shadow:0 0 0 2px var(--c),0 18px 40px rgba(11,22,38,.12)}
.ev-bars{grid-template-columns:repeat(var(--n,7),1fr)}


/* ================= v4: 디자인·애니메이션 개편 ================= */
/* 전체 분위기: 머리말 아래 색 막대, 은은한 배경 빛, 사진 천천히 확대 */
.slide:not(.t-cover):not(.t-closing):not(.t-why)::before{content:"";position:absolute;right:-180px;top:-220px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(47,107,255,.10)),rgba(47,107,255,0) 68%);pointer-events:none}
.slide:not(.t-cover):not(.t-closing):not(.t-why)::after{content:"";position:absolute;left:-200px;bottom:-260px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(18,165,148,.07),rgba(18,165,148,0) 70%);pointer-events:none}
.slide .s-head{position:relative}
.slide .s-head .lead{position:relative}
.slide .s-head .lead::after{content:"";display:block;width:84px;height:5px;border-radius:3px;margin-top:14px;background:linear-gradient(90deg,var(--c-blue),var(--c-teal));transform-origin:left}
.slide.play .s-head .lead::after{animation:grow .8s .35s cubic-bezier(.2,.7,.2,1) both}
.slide .s-head{margin-bottom:26px}
.ph img{transition:transform .6s ease}
.slide.play .ph img{animation:kenburns 14s ease-out both}

/* ---------- 01 왜 만드는가 ---------- */
.slide.t-why{padding:0;background:#fff}
.wy2{display:grid;grid-template-columns:600px 1fr;height:100%}
.wy2-l{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.wy2-ph{position:absolute;inset:0;background:#16233A}
.wy2-ph img{opacity:.55}
.wy2-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,22,38,.55),rgba(11,22,38,.25) 40%,rgba(11,22,38,.92));pointer-events:none}
.wy2-in{position:relative;z-index:2;height:100%;box-sizing:border-box;padding:64px 56px 56px 96px;display:flex;flex-direction:column}
.wy2-big{font-size:64px;line-height:1.18;font-weight:800;letter-spacing:-.03em;margin:auto 0 0;white-space:pre-line;background:linear-gradient(100deg,#fff 55%,var(--mint) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
body.editing .wy2-big{color:#fff;background:none}
.wy2-hint{font-size:21px;color:rgba(255,255,255,.7);margin:22px 0 0;padding-left:18px;border-left:3px solid var(--mint)}
.wy2-cap{position:absolute;left:96px;bottom:22px;font-size:13px;color:rgba(255,255,255,.45)}
.slide.play .wy2-big{animation:rise .9s .25s cubic-bezier(.2,.7,.2,1) both,shimmer 6s 1.2s ease-in-out infinite alternate;background-size:200% 100%}
.wy2-r{display:flex;flex-direction:column;padding:64px 96px 50px 64px;min-width:0}
.wy2-lead{font-size:38px;font-weight:800;letter-spacing:-.025em;margin:0 0 26px;color:var(--ink)}
.wy2-cards{display:flex;flex-direction:column;gap:20px;flex:1;min-height:0;justify-content:center}
.wy2-c{position:relative;display:grid;grid-template-columns:76px 1fr auto;gap:22px;align-items:center;padding:28px 28px;border-radius:20px;background:#fff;border:1.5px solid var(--line);box-shadow:0 14px 40px -20px rgba(15,26,44,.25);overflow:hidden}
.wy2-c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.wy2-c.on{animation:cardIn .7s cubic-bezier(.2,.8,.2,1.15) both}
@keyframes cardIn{0%{opacity:0;transform:translateX(60px) scale(.96)}100%{opacity:1;transform:none}}
.wy2-ic{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);position:relative}
.wy2-ic svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wy2-ic span{position:absolute;top:-8px;right:-8px;font:600 13px var(--font-mono);background:var(--c);color:#fff;border-radius:999px;padding:2px 7px}
.wy2-h{display:block;font-size:32px;font-weight:800;color:var(--c);letter-spacing:-.02em}
.wy2-t{font-size:22px;color:var(--ink);margin:4px 0 10px;font-weight:600}
.wy2-q{margin:0;padding:10px 14px;border-radius:12px;background:var(--surface)}
.wy2-q p{margin:0;font-size:18px;color:var(--ink-2);line-height:1.5}
.wy2-q p::before{content:"“"}.wy2-q p::after{content:"”"}
.wy2-q cite{display:block;font-style:normal;font-size:13px;color:var(--ink-3);margin-top:4px}
.wy2-ex{width:230px;display:flex;flex-direction:column;gap:8px}
.wy2-exph{height:140px;border-radius:14px}
.wy2-ex span{font-size:13px;line-height:1.4;color:var(--ink-3)}
.wy2-bottom{display:flex;align-items:center;gap:14px;margin-top:20px;padding:20px 26px;border-radius:16px;background:var(--navy);color:#fff;font-size:26px;font-weight:800;letter-spacing:-.02em}
.wy2-bottom svg{width:28px;height:28px;fill:none;stroke:var(--mint);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wy2-bottom.on{animation:popQ .8s .25s cubic-bezier(.2,.8,.2,1.2) both}
@keyframes popQ{0%{opacity:0;transform:translateY(20px) scale(.97)}100%{opacity:1;transform:none}}
.wy2-r .s-foot{margin-top:18px}

/* ---------- 02 혁신의 터널 ---------- */
.funnel2{display:grid;grid-template-columns:1fr 470px;gap:30px;align-items:stretch}
.tn2{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px 28px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px -30px rgba(15,26,44,.35)}
.tn2-svg{width:100%;height:auto;overflow:visible}
.tn2-shape{stroke:none}
.tn2-edge{fill:none;stroke:var(--c-blue);stroke-opacity:.35;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:0}
.slide.play .tn2-edge{animation:draw 1.4s .2s ease-out both}
.tn-p{fill:var(--c-blue);fill-opacity:.55}
.tn-p.win{fill:var(--c-teal);fill-opacity:1;filter:drop-shadow(0 0 6px rgba(18,165,148,.8))}
.tn2-c{fill:var(--c-blue);fill-opacity:.85;stroke:#fff;stroke-width:3}
.tn2-node:last-of-type .tn2-c{fill:var(--c-teal);fill-opacity:1}
.tn2-node{opacity:1;transform-box:fill-box;transform-origin:center}
.slide.play .tn2-node{animation:nodePop .6s cubic-bezier(.2,.8,.2,1.4) both;animation-delay:calc(.7s + var(--k) * .55s)}
@keyframes nodePop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
.tn2-ring{fill:none;stroke:var(--c-teal);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:pulse 2s 2.6s ease-out infinite}
.tn2-glow{opacity:.9}
.tn2-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0;padding:0;list-style:none}
.tn2-steps li{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:14px;background:var(--surface);position:relative}
.tn2-steps li:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:16px}
.tn2-steps b{font:700 30px var(--font-display);color:var(--ink);letter-spacing:-.02em}
.tn2-steps span{font-size:17px;color:var(--ink-2)}
.tn2-steps li:last-child{background:var(--teal-soft)}
.tn2-steps li:last-child b{color:var(--c-teal)}
.slide.play .tn2-steps li{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.8s + var(--k) * .55s)}
.tn2-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.tn2-ph{position:relative;height:118px;border-radius:18px;overflow:hidden}
.tn2-phi{position:absolute;inset:0}
.tn2-ph span{position:absolute;left:12px;bottom:10px;font-size:13px;color:#fff;background:rgba(11,22,38,.55);padding:4px 10px;border-radius:999px}
.tn2-r .nw{margin:0}
.tn2-r .fn-bottom{margin-top:auto}

/* ---------- 02 캐즘 ---------- */
.chasm{gap:16px}
.cz-wrap{position:relative;flex:1;min-height:0;padding:10px 20px 0;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px -30px rgba(15,26,44,.35)}
.cz-svg{display:block;width:100%;height:auto;max-height:350px}
.cz-seg{fill:var(--c);fill-opacity:.82;stroke:#fff;stroke-width:2}
.slide.play .cz-seg{animation:segIn .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--k) * .26s);transform-origin:50% 300px;transform-box:view-box}
@keyframes segIn{0%{opacity:0;transform:scaleY(0)}100%{opacity:1;transform:none}}
.cz-cum{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:6 6;opacity:.5}
.cz-axis{stroke:var(--line-2);stroke-width:2}
.cz-left,.cz-right{transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .5s}
.slide.cz-open .cz-left{animation:shake .5s .2s ease-in-out 2}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px) rotate(-.4deg)}75%{transform:translateX(3px) rotate(.3deg)}}
.cz-gaprect{fill:url(#none);fill:var(--navy);opacity:0;transition:opacity .6s}
.slide.cz-open .cz-gaprect{opacity:.92}
.cz-crack{fill:none;stroke:var(--c-coral);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s .2s}
.slide.cz-open .cz-crack{stroke-dashoffset:0}
.cz-gt{font:800 17px var(--font-display);fill:var(--c-coral);text-anchor:middle;letter-spacing:.04em;opacity:0;transition:opacity .5s .5s}
.slide.cz-open .cz-gt{opacity:1}
.cz-labels{position:relative;height:84px;margin:0 20px}
.cz-lb{position:absolute;top:4px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.cz-lb b{font:800 26px var(--font-display);color:var(--c)}
.cz-lb .en{font-size:15px;font-weight:600;color:var(--ink)}
.cz-lb .ko{font-size:14px;color:var(--ink-3)}
.slide.play .cz-lb{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.6s + var(--k) * .26s)}
.cz-fail{position:absolute;left:36px;top:18px;width:360px;padding:16px 18px;border-radius:18px;background:#fff;border:2px solid var(--c-coral);box-shadow:0 20px 50px -24px rgba(242,84,91,.55)}
.cz-ft{display:flex;align-items:center;gap:8px;font-size:22px;color:var(--c-coral);font-weight:800}
.cz-ft svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cz-ex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cz-ex figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cz-exph{height:92px;border-radius:12px;background:var(--surface)}
.cz-ex figcaption{font-size:15px;font-weight:700;color:var(--ink);text-align:center}
.cz-fs{display:block;margin-top:8px;font-size:13px;color:var(--ink-3)}
.cz-ok{position:absolute;right:40px;top:26px}
.cz-ok b{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;color:var(--c-teal);padding:10px 18px;border-radius:999px;background:var(--teal-soft)}
.cz-ok svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.cz-chasm-lb{position:absolute;top:150px;transform:translateX(-50%);writing-mode:horizontal-tb;font-size:16px;font-weight:800;color:#fff;background:var(--c-coral);padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(242,84,91,.8)}
.cz-fail.on{animation:cardIn .7s .25s cubic-bezier(.2,.8,.2,1.1) both}
.cz-bottom{display:flex;align-items:center;gap:14px;padding:16px 24px;border-radius:16px;background:var(--navy);color:#fff;font-size:22px;font-weight:700}
.cz-bottom svg{width:24px;height:24px;fill:none;stroke:var(--mint);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- 03 세부 절차 예시 ---------- */
.example{gap:16px}
.ex-grid{display:grid;grid-template-columns:1.05fr 1fr 1fr 1.15fr;gap:18px;flex:1;min-height:0}
.ex-col{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:var(--surface);position:relative;min-width:0}
.ex-col:not(:last-child)::after{content:"";position:absolute;right:-15px;top:50%;width:12px;height:12px;border-top:3px solid var(--line-2);border-right:3px solid var(--line-2);transform:translateY(-50%) rotate(45deg)}
.ex-h{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ex-n{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--c-blue);color:#fff;font:700 17px var(--font-mono)}
.ex-h b{display:block;font-size:20px;font-weight:800}
.ex-h span{font-size:14px;color:var(--ink-3)}
.ex-voice{position:relative;display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:16px 16px 16px 4px;background:#fff;font-size:18px;font-weight:600;color:var(--ink);box-shadow:0 8px 24px -16px rgba(15,26,44,.4);min-height:64px;box-sizing:border-box}
.ex-voice svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--c-blue);stroke-width:2;stroke-linejoin:round}
.slide.play .ex-voice{animation:bubble .6s cubic-bezier(.2,.8,.2,1.3) both;animation-delay:calc(.5s + var(--k) * .3s)}
@keyframes bubble{0%{opacity:0;transform:scale(.6) translateY(10px)}100%{opacity:1;transform:none}}
.ex-spec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;border-left:5px solid var(--c);min-height:64px;box-sizing:border-box}
.ex-spec b{font-size:17px;color:var(--c);font-weight:800}
.ex-spec span{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.ex-spec em{font:600 13px var(--font-mono);font-style:normal;color:var(--ink-3);background:var(--surface);border-radius:999px;padding:2px 8px}
.frag.on .ex-spec,.frag.on .ex-con{animation:cardIn .55s cubic-bezier(.2,.8,.2,1.1) both;animation-delay:calc(var(--k) * .14s)}
.ex-con{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:#fff;min-height:64px;box-sizing:border-box;border:2px solid transparent}
.ex-cn{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font:800 20px var(--font-display);background:var(--raise);color:var(--ink-2)}
.ex-con b{display:block;font-size:18px}
.ex-con span{font-size:14px;color:var(--ink-2)}
.ex-score{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.ex-bar{display:grid;grid-template-columns:28px 1fr 44px;gap:10px;align-items:center;position:relative;min-height:50px}
.ex-bn{font:800 20px var(--font-display);color:var(--ink-2)}
.ex-track{height:26px;border-radius:8px;background:#fff;overflow:hidden}
.ex-track i{display:block;height:100%;width:var(--w);border-radius:8px;background:var(--line-2);transform-origin:left;transform:scaleX(0)}
.frag.on .ex-track i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--k) * .18s)}
.ex-bar b{font:700 22px var(--font-mono);color:var(--ink-2)}
.ex-bar.best .ex-track i{background:linear-gradient(90deg,var(--c-blue),var(--c-teal))}
.ex-bar.best b,.ex-bar.best .ex-bn{color:var(--c-blue)}
.ex-crown{position:absolute;right:-6px;top:-18px;color:var(--c-orange)}
.ex-crown svg{width:28px;height:28px;fill:color-mix(in srgb,var(--c-orange) 25%,#fff);stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.frag.on .ex-crown{animation:pop .5s 1.1s cubic-bezier(.2,.8,.2,1.6) both}
.frag.on ~ .ex-col .ex-con.best,.ex-grid:has(.ex-col.frag.on:last-child) .ex-con.best{border-color:var(--c-blue);box-shadow:0 10px 30px -16px rgba(47,107,255,.6)}
.ex-grid:has(.ex-col.frag.on:last-child) .ex-con.best .ex-cn{background:var(--c-blue);color:#fff}
.ex-calc{margin:auto 0 0;font:500 14px var(--font-mono);color:var(--ink-2);background:#fff;border-radius:10px;padding:8px 10px}
.ex-foot{display:flex;gap:16px;align-items:center}
.ex-next{display:flex;gap:12px;align-items:center;padding:14px 20px;border-radius:14px;background:var(--navy);color:#fff;font-size:19px;font-weight:700;flex:1}
.ex-next svg{width:22px;height:22px;fill:none;stroke:var(--mint);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ex-note{display:flex;gap:8px;align-items:center;margin:0;font-size:14px;color:var(--ink-3);max-width:420px}
.ex-note svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2}

/* ---------- 04 불닭 그 후 ① 지도 ---------- */
.world{display:grid;grid-template-columns:400px 1fr;gap:26px}
.wl-l{display:flex;flex-direction:column;gap:16px;min-width:0}
.wl-line{padding:20px 22px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px -30px rgba(15,26,44,.35)}
.wl-tl{list-style:none;margin:12px 0 0;padding:0;position:relative}
.wl-tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--c-coral),var(--c-orange))}
.wl-tl li{position:relative;display:flex;flex-direction:column;gap:2px;padding:0 0 16px 30px}
.wl-tl li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--c-coral)}
.wl-tl li:last-child{padding-bottom:0}
.wl-when{font:600 14px var(--font-mono);color:var(--c-coral)}
.wl-tl li>div{display:flex;flex-direction:column;gap:2px}
.wl-tl b{font-size:20px;font-weight:800}
.wl-tl li span:not(.wl-when){font-size:15px;color:var(--ink-2)}
.frag.on .wl-tl li{animation:cardIn .5s cubic-bezier(.2,.8,.2,1.1) both;animation-delay:calc(var(--k) * .18s)}
.wl-chips{display:flex;flex-wrap:wrap;gap:8px}
.wl-chips span{font-size:16px;font-weight:700;padding:8px 14px;border-radius:999px;background:color-mix(in srgb,var(--c-coral) 10%,#fff);color:var(--c-coral);border:1px solid color-mix(in srgb,var(--c-coral) 30%,#fff)}
.frag.on .wl-chips span,.wl-chips.on span{animation:pop .45s cubic-bezier(.2,.8,.2,1.5) both;animation-delay:calc(.4s + var(--k) * .1s)}
.wl-map{position:relative;padding:18px 20px;border-radius:20px;background:linear-gradient(160deg,#0E1B30,#13284A);color:#fff;min-width:0}
.wl-map .kicker{color:var(--mint)}
.wm{position:relative;margin-top:8px}
.wm-svg{display:block;width:100%;height:auto}
.wm-base{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.15;stroke-linecap:round}
.wm-hl path{fill:none;stroke:var(--c-coral);stroke-width:1.25;stroke-linecap:round;opacity:.75}
.wm-lead{stroke:rgba(255,255,255,.4);stroke-width:.18;stroke-dasharray:.6 .5}
.wm-pin{fill:#fff;stroke:var(--c-coral);stroke-width:.5}
.wm-pin.home{fill:var(--mint);stroke:#fff}
.wm-pulse{fill:none;stroke:var(--c-coral);stroke-width:.35;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite;animation-delay:calc(var(--k) * .3s)}
.wm-ret{fill:none;stroke:var(--c-coral);stroke-width:.5;stroke-dasharray:1.4 1;animation:dashflow 1.6s linear infinite}
.wm-lb{position:absolute;max-width:190px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.96);color:var(--ink);box-shadow:0 10px 24px -12px rgba(0,0,0,.6);transform:translateY(-2px)}
.wm-lb.ar{transform:translate(-100%,-2px)}
.wm-lb b{display:block;font-size:15px;font-weight:800;color:var(--c-coral)}
.wm-lb span{display:block;font-size:13px;line-height:1.35;color:var(--ink-2)}
.wm-lb.home{background:var(--mint)}
.wm-lb.home b{color:var(--navy)}
.wm-lb.on{animation:pop .45s cubic-bezier(.2,.8,.2,1.5) both;animation-delay:calc(var(--k) * .12s)}
.wm-ret-lb{position:absolute;left:0;bottom:0;display:flex;gap:8px;align-items:center;max-width:62%;font-size:15px;font-weight:700;color:#fff;background:rgba(242,84,91,.9);padding:8px 14px;border-radius:12px}
.wm-ret-lb svg{width:18px;height:18px;flex:none;fill:none;stroke:#fff;stroke-width:2.2}
.wl-cav{margin:10px 0 0}

/* ---------- 04 불닭 그 후 ② 숫자 ---------- */
.growth{gap:16px}
.gr-row{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;min-height:0}
.gr-card{display:flex;flex-direction:column;gap:8px;padding:18px 22px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px -30px rgba(15,26,44,.35);min-height:0}
.gr-line{width:100%;height:auto;max-height:250px;overflow:visible}
.gr-path{fill:none;stroke:var(--c-coral);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.slide.play .gr-path{animation:draw 1.8s .4s cubic-bezier(.4,0,.2,1) both}
.slide.play .gr-area{animation:fadein 1s 1.6s both}
.gr-pt circle{fill:#fff;stroke:var(--c-coral);stroke-width:3.5}
.gr-pt:last-child circle{fill:var(--c-coral)}
.slide.play .gr-pt{animation:pop .4s cubic-bezier(.2,.8,.2,1.6) both;animation-delay:calc(.5s + var(--k) * .28s)}
.gr-v{font:700 17px var(--font-display);fill:var(--ink);text-anchor:middle}
.gr-v.last{font-size:24px;fill:var(--c-coral)}
.gr-x{font-size:13px;fill:var(--ink-3);text-anchor:middle}
.gr-note{margin:auto 0 0;font-size:13px;color:var(--ink-3)}
.gr-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;height:250px}
.gr-b{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.gr-bv{font:700 14px var(--font-display);color:var(--ink-2);white-space:nowrap}
.gr-b.last .gr-bv{font-size:17px;color:var(--c-orange)}
.gr-bar{position:relative;width:100%;height:calc(var(--h) * 1.7px);border-radius:10px 10px 4px 4px;overflow:hidden}
.gr-bar i{position:absolute;inset:0;background:color-mix(in srgb,var(--c-orange) 55%,#fff);transform-origin:bottom}
.gr-b.last .gr-bar i{background:linear-gradient(180deg,var(--c-orange),var(--c-coral))}
.frag.on .gr-bar i{animation:evGrow .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * .14s)}
.gr-bar em{position:absolute;left:0;right:0;top:8px;text-align:center;font:700 15px var(--font-mono);font-style:normal;color:#fff}
.gr-bx{font-size:14px;color:var(--ink-3)}
.gr-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gr-f{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:16px;background:var(--surface);border-left:5px solid var(--c)}
.gr-fi{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--c)}
.gr-fi svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gr-fw{display:block;font:600 13px var(--font-mono);color:var(--c)}
.gr-f b{display:block;font-size:18px;font-weight:800}
.gr-f div>span:last-child{font-size:14px;color:var(--ink-2)}
.frag.on .gr-f{animation:cardIn .55s cubic-bezier(.2,.8,.2,1.1) both;animation-delay:calc(var(--k) * .15s)}

/* ---------- 04 폴드 그 후 ---------- */
.foldgen{display:grid;grid-template-columns:1fr 430px;gap:24px}
.fg-l{position:relative;display:flex;flex-direction:column;padding:18px 22px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px -30px rgba(15,26,44,.35);min-width:0}
.fg-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.fg-kpi{display:flex;align-items:center;gap:12px}
.fg-kpi span{display:flex;align-items:baseline;gap:3px}
.fg-kpi b{font:800 30px var(--font-display);color:var(--ink-3);letter-spacing:-.02em}
.fg-kpi .to b{font-size:42px;color:var(--c-blue)}
.fg-kpi small{font-size:15px;color:var(--ink-3)}
.fg-kpi svg{width:26px;height:26px;fill:none;stroke:var(--ink-3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fg-kpi em{font-style:normal;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--c-blue),var(--c-teal));padding:6px 12px;border-radius:999px}
.fg-svg{width:100%;height:auto;max-height:360px;overflow:visible}
.fg-ref{stroke:var(--c-coral);stroke-width:1.5;stroke-dasharray:6 6;opacity:.7}
.fg-reft{font-size:13px;fill:var(--c-coral);text-anchor:end;font-weight:700}
.fg-base{stroke:var(--line-2);stroke-width:2}
.fg-slab{fill:color-mix(in srgb,var(--c-blue) calc(30% + var(--t) * 60%),#C9D2E0);transform-box:fill-box;transform-origin:bottom;transition:fill .3s,filter .3s}
.fg-m:first-child .fg-slab{fill:#B7C0CF}
.slide.play .fg-slab{animation:evGrow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--k) * .16s)}
.fg-hinge{stroke:rgba(255,255,255,.7);stroke-width:2;stroke-linecap:round}
.fg-v{font:700 17px var(--font-mono);fill:var(--ink);text-anchor:middle}
.fg-m:last-child .fg-v{font-size:21px;fill:var(--c-blue)}
.fg-n{font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle}
.fg-s{font-size:12.5px;fill:var(--ink-3);text-anchor:middle}
.fg-curve{fill:none;stroke:var(--c-teal);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:0;opacity:.7}
.slide.play .fg-curve{animation:draw 1.4s 1.5s ease-out both}
.fg-m{transition:opacity .3s}
.foldgen:has(.fg-m.on) .fg-m:not(.on){opacity:.35}
.fg-m.on .fg-slab{fill:var(--c-orange);filter:drop-shadow(0 6px 12px rgba(255,138,43,.45))}
.fg-chart{position:relative}
.fg-tags{position:absolute;left:0;right:0;top:0;height:0}
.fg-tag{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 12px;border-radius:12px;background:var(--navy);color:#fff;white-space:nowrap;box-shadow:0 12px 26px -12px rgba(11,22,38,.7)}
.fg-tag::after{content:"";position:absolute;bottom:-7px;left:50%;width:12px;height:12px;background:var(--navy);transform:translateX(-50%) rotate(45deg)}
.fg-tag b{font-size:15px;color:var(--c-orange)}
.fg-tag span{font-size:14px}
.fg-tag{display:none}
.fg-tag.cur{display:flex;animation:pop .45s cubic-bezier(.2,.8,.2,1.5) both}
.slide.show-all .fg-tags{position:static;height:auto;display:flex;gap:10px;justify-content:center;margin-top:8px}
.slide.show-all .fg-tag{display:flex;position:relative;left:auto!important;transform:none;top:0}
.slide.show-all .fg-tag::after{display:none}
.fg-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.fg-new{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:10px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px -24px rgba(15,26,44,.45)}
.fg-np{height:96px;border-radius:12px;background:var(--surface)}
.fg-nw{display:block;font:600 13px var(--font-mono);color:var(--c-violet)}
.fg-new b{display:block;font-size:19px;font-weight:800}
.fg-new div>span:last-child{font-size:14px;color:var(--ink-2);line-height:1.4}
.fg-new.on{animation:cardIn .6s cubic-bezier(.2,.8,.2,1.1) both;animation-delay:calc(var(--k) * .15s)}
.fg-lesson{margin-top:14px}

/* ---------- 05 결론 ---------- */
.concl2{gap:26px;justify-content:center}
.cn2-w{position:relative;padding:26px 28px 14px;border-radius:22px;background:linear-gradient(160deg,#0E1B30,#152C52);color:#fff}
.cn2-track{position:absolute;left:calc(28px + (100% - 56px) / 12);right:calc(28px + (100% - 56px) / 12);top:68px;height:5px;border-radius:2px;background:rgba(255,255,255,.14)}
.cn2-fill{position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,var(--c-blue),var(--c-teal),var(--c-orange));transform-origin:left}
.slide.play .cn2-fill{animation:grow 2.2s .3s cubic-bezier(.4,0,.2,1) both}
.cn2-dot{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(127,224,210,.25),0 0 18px 4px rgba(127,224,210,.8);opacity:0}

          plain: "단계 이름은 대량 생산이지만, 핵심 활동에 영업도 함께 들어 있다" }
      ],
      bottom: "강의자료에는 5·6단계가 한 줄씩만 설명되어 있어, 원문 범위 안에서만 다룬다",
      bottomIcon: "info",
      sources: [{ label: "「경영프로젝트의 개발」 35장 (5·6단계 행)", url: "" }],
      script: "5단계는 시장진출 준비입니다. 핵심 활동은 영업준비이고, 목적은 시장 도입을 시작하는 데 필요한 영업을 준비하는 것입니다.\n[엔터 ⏎ 6단계 대량 생산] 마지막 6단계는 대량 생산입니다. 핵심 활동은 생산과 영업이고, 목적은 생산과 영업 체제를 조기에 확립하고 안정시키는 것입니다. 단계 이름은 대량 생산이지만 핵심 활동에 영업도 함께 들어 있다는 점이 눈에 띕니다.\n[엔터 ⏎ 원문 범위] 강의자료에는 이 두 단계가 한 줄씩만 설명돼 있어서, 저희도 원문 범위 안에서만 말씀드렸습니다.\n[엔터 ⏎ 다음 장]",
      notes: "· 입장: 5단계 카드 → 엔터 1: 6단계 카드 → 엔터 2: 아래 줄.\n· 제목의 ‘시장에 내놓고, 체제를 안정시킨다’는 발표자 표현이다.\n· 표 안은 35장 원문이다. 영업 준비의 구체적인 활동(가격, 유통 등)은 강의자료에 없으므로 덧붙이지 않는다."
    },
    {"id":"p6","type":"case","duration":45,"title":"사례 ① 삼양식품 불닭볶음면 · 강의자료 밖 기사 사례","lead":"고객의 [[매운맛 수요]]를 제품으로 구체화했다","img":{"src":"https://img1.newsis.com/2022/04/15/NISI20220415_0000975724_web.jpg","caption":"불닭볶음면 (사진: 뉴시스)","pos":"50% 50%"},"stats":[{"n":1,"u":"년 (약)","l":"개발 기간"},{"n":2,"u":"톤","l":"매운 소스"},{"n":1200,"u":"마리","l":"닭"}],"steps":[{"stage":"개념 정립","when":"2011","what":"명동 음식점에서 매운 음식을 먹는 젊은이들을 보고 더 매운 라면 개발에 착수"},{"stage":"니즈 구체화","when":"","what":"마케팅·연구소 직원이 전국 불닭·불곱창 맛집을 탐방하며 목표 매운맛을 파악"},{"stage":"제품 개발 · 개선","when":"약 1년","what":"소스 2t, 닭 1,200마리를 쓰며 [[시식과 수정을 반복]]"},{"stage":"출시 · 시장 반응","when":"2012.04","what":"출시 초기 국내 월 매출 7~8억 원 → 출시 1년 월 30억 원대"}],"groupAt":[1,1,2,3],"caveat":"기사로 확인한 사실 · 단계 연결은 조 해석 · 공정 엔지니어링·시장진출 준비 과정은 공개 자료에서 확인하지 못함","lesson":"출시 전에 [[시식과 수정을 반복]]했다","sources":[{"label":"뉴시스 2022.04.17","url":"https://www.newsis.com/view/NISX20220415_0001834542"}],"script":"이제 사례입니다. 사례는 강의자료가 아니라 기사로 확인한 내용이고, 6단계와 연결한 부분은 저희의 해석입니다. 첫 번째는 불닭볶음면입니다.\n[엔터 ⏎ 개념 정립 · 니즈 구체화] 2011년 김정수 부회장이 명동에서 젊은 사람들이 땀을 흘리며 매운 음식을 먹는 모습을 보고 더 매운 라면 개발을 시작했습니다. 직원들은 전국 맛집을 다니며 목표 매운맛을 찾았습니다.\n[엔터 ⏎ 제품 개발 · 개선] 약 1년 동안 소스 2톤과 닭 1,200마리를 쓰며 시식과 수정을 반복했고,\n[엔터 ⏎ 출시 · 시장 반응] 2012년 4월 출시 후 1년 만에 월 매출이 30억 원대가 됐습니다.\n[엔터 ⏎ 다음 장]","notes":"· 엔터 1: 개념 정립·니즈 구체화 → 엔터 2: 제품 개발·개선 → 엔터 3: 출시·시장 반응.\n· 자료: 뉴시스 「[장수브랜드 탄생비화] K-푸드 아이콘이 된 ‘불닭볶음면’」(2022.04.17) https://www.newsis.com/view/NISX20220415_0001834542\n· 기사 원문: ‘2011년 김 부회장은 우연히 방문한 명동 소재 음식점에서 젊은이들이 땀을 뻘뻘 흘리면서도’ 매운 음식을 먹는 모습을 보고 ‘더 매운 맛을 느낄 수 있는 라면 개발에 착수했다’, ‘마케팅 부서와 연구소 직원들과 함께 전국 유명 불닭, 불곱창 맛집들을 일제히 탐방했다’, ‘개발에만 약 1년이 소요됐고 매운소스 2t과 닭 1200마리가 투입됐다’, ‘출시 초기 국내 매출은 월 7~8억원 정도’, ‘출시 1년에는 월 30억원대 매출’.\n· 단계 연결(개념 정립, 니즈 구체화, 제품 개발·개선)은 저희 조의 해석이다. 공정 엔지니어링이나 영업 준비 과정은 기사에 나오지 않아 말하지 않는다."},
    {"id":"p6b","type":"world","duration":42,"title":"사례 ① 불닭볶음면, 출시 그 후 · 맛과 나라를 넓히다","lead":"[[19종의 시리즈]]와 [[나라별 버전]]으로 커졌다","headImg":{"src":"https://img1.newsis.com/2022/11/11/NISI20221111_0001127301_web.jpg","caption":"불닭볶음면 해외 홍보 현장 (사진: 뉴시스 2022.11)","pos":"50% 50%"},"lineLabel":"국내 · 맛을 넓히다","line":[{"when":"2012.04","h":"불닭볶음면 출시","t":""},{"when":"2017 → 2018","h":"까르보불닭","t":"한정판으로 냈다가 소비자 요구로 정식 제품"},{"when":"2024.01","h":"시리즈 19종","t":"치즈·핵불닭·커리·불닭볶음탕면 등"}],"flavors":["치즈","핵불닭","커리","까르보","불닭볶음탕면","…"],"mapLabel":"해외 · 나라별로 바꾸다","pins":[{"name":"한국","t":"출발점 · 수출 전용 밀양공장","lon":127.5,"lat":37,"lx":133,"ly":5,"al":"r","home":1},{"name":"미주","t":"하바네로라임 · 콘불닭","lon":-98,"lat":39,"lx":8,"ly":25},{"name":"일본","t":"야키소바불닭","lon":138,"lat":36,"lx":133,"ly":20,"al":"r"},{"name":"중국","t":"양념치킨불닭 · 마라불닭","lon":104,"lat":35,"lx":86,"ly":2},{"name":"태국","t":"똠얌 불닭볶음탕면 (2023, 수출용)","lon":101,"lat":15,"lx":74,"ly":30},{"name":"동남아","t":"커리불닭 · 3xSpicy 핵불닭","lon":110,"lat":2,"lx":98,"ly":44},{"name":"유럽","t":"네덜란드 슈퍼마켓 최고 신제품 선정 (까르보, 2024)","lon":5,"lat":52,"lx":44,"ly":2}],"returns":[1,2],"returnLabel":"[[역출시]]: 해외에서 먼저 낸 하바네로라임·야키소바를 2023년 국내에도 출시","caveat":"기사로 확인한 제품만 표시 · 나라별 제품은 기사 시점 기준이며 전체 목록이 아님","sources":[{"label":"세계일보 2024.01.16","url":"https://www.segye.com/newsView/20240116515186"},{"label":"MTN 2023.09.27","url":"https://news.mtn.co.kr/news-detail/2023092615285053368"},{"label":"머니투데이 2025.12.04","url":"https://www.mt.co.kr/living/2025/12/04/2025120217480910864"}],"script":"출시 이후 불닭은 두 방향으로 넓어졌습니다.\n[엔터 ⏎ 국내 맛 확장] 국내에서는 맛을 넓혔습니다. 까르보불닭은 한정판으로 냈다가 소비자 요구로 정식 제품이 됐고, 2024년에는 시리즈가 19종이 됐습니다.\n[엔터 ⏎ 나라별 버전] 해외에서는 나라별로 맛을 바꿨습니다. 미주는 하바네로라임, 일본은 야키소바, 중국은 마라와 양념치킨, 태국은 똠얌 맛을 냈습니다.\n[엔터 ⏎ 역출시] 해외에서 먼저 낸 맛이 거꾸로 국내에 출시되기도 했습니다.\n[엔터 ⏎ 다음 장]","notes":"· 엔터 1: 국내 맛 확장 → 엔터 2: 나라별 버전(지도) → 엔터 3: 역출시 화살표.\n· 세계일보(2024.01.16): ‘2017년 국내 한정판으로 출시한 까르보불닭볶음면은 출시 3개월간 3600만개가 판매됐고, 인기에 힘입어 2018년 정식 제품이 됐다’, ‘치즈불닭볶음면과 불닭볶음탕면, 커리불닭볶음면, 핵불닭볶음면, 까르보불닭볶음면 등 19종으로 확장’, ‘미주 지역에선 … 하바네로라임불닭볶음면, 일본에선 야키소바불닭볶음면, 중국에선 양념치킨불닭볶음면’, ‘현재 100여개국에 수출’. (같은 기사 사진 설명에는 출시 연도가 2014년으로 잘못 적혀 있고, 본문은 2012년 4월이다.)\n· MTN(2023.09.27): 수출용 똠얌 불닭볶음탕면을 태국에 먼저 출시 예정, 야키소바(일본에서 먼저)·하바네로라임(미국에서 먼저)을 6월 국내 출시, 커리·3xSpicy 핵불닭(동남아), 마라(중국), 콘불닭(미국).\n· 파이낸셜뉴스(2026.07.13) ‘역출시’ 기사: 푸팟퐁커리·야끼소바·하바네로라임 불닭볶음면을 해외 판매 후 국내 출시.\n· 머니투데이(2025.12.04): 까르보불닭볶음면이 ‘지난해 네덜란드 슈퍼마켓에서 출시된 모든 신제품 중 최고의 제품으로 선정’.\n· 밀양공장: 데일리안(2022.05.02) 수출 전용, 연간 최대 6억 개.\n· 아시아경제(2018.04.03)는 까르보불닭 한정판 출시를 ‘지난해 12월’로 적었다.\n· 지도 위 표시는 기사로 확인한 제품만이며 판매 국가 전체가 아니다. ‘한정판 → 정식 제품’을 시장 반응에 따른 결정으로 본 것은 기사 내용이고, 이를 신제품 개발 절차와 연결하는 것은 저희 조의 해석이다."},
    {"id":"p6c","type":"growth","duration":39,"title":"사례 ① 불닭볶음면, 출시 그 후 · 숫자로 보기","lead":"[[해외 매출]]이 커지자 [[생산도 해외로]] 넓혔다","headImg":{"src":"https://image.fnnews.com/resource/media/image/2025/06/11/202506111003480912_l.jpg","caption":"불닭볶음면 생산 라인 (사진: 파이낸셜뉴스)","pos":"50% 50%"},"cumLabel":"불닭 누적 판매량 (억 개)","cum":[{"x":"2017","v":10},{"x":"2019","v":20},{"x":"2021","v":30},{"x":"2022","v":40},{"x":"2023.3Q","v":53},{"x":"2025 상반기","v":80}],"cumNote":"기사마다 집계 기준(브랜드 면 제품 / 시리즈)이 조금 다를 수 있음","revLabel":"삼양식품 해외 매출과 비중","rev":[{"x":"2020","v":3703,"label":"3,703억","share":57},{"x":"2021","v":3885,"label":"3,885억","share":61},{"x":"2022","v":6050,"label":"6,050억","share":67},{"x":"2023","v":8093,"label":"8,093억","share":68},{"x":"2024","v":13359,"label":"1조 3,359억","share":77}],"revNote":"막대 안 % = 전체 매출 중 해외 비중 (자료: 삼양식품, 머니투데이 그래픽)","facts":[{"when":"2022.05","h":"밀양공장 준공","t":"수출 전용 · 연간 최대 6억 개"},{"when":"2025.12 보도","h":"중국 자싱 첫 해외 공장 건립 중","t":"국내외 5개 공장 연 38억 개 생산 예정"},{"when":"2025","h":"약 100개국 판매","t":"누적 80억 개 (2025 상반기)"}],"sources":[{"label":"데일리안 2022.08.01","url":"https://www.dailian.co.kr/news/view/1138144/"},{"label":"세계일보 2024.01.16","url":"https://www.segye.com/newsView/20240116515186"},{"label":"토요경제 2025.09.24","url":"https://sateconomy.co.kr/news/view/1065588939427354"},{"label":"머니투데이 2025.12.04","url":"https://www.mt.co.kr/living/2025/12/04/2025120217480910864"}],"script":"숫자로도 보겠습니다. 누적 판매량은 2017년 10억 개에서 2025년 상반기 80억 개가 됐습니다.\n[엔터 ⏎ 해외 매출] 해외 매출은 2020년 3,703억 원에서 2024년 1조 3,359억 원으로 늘었고, 전체 매출의 77%가 됐습니다.\n[엔터 ⏎ 생산 확대] 그래서 생산도 넓혔습니다. 2022년 수출 전용 밀양공장을 지었고, 지금은 중국에 첫 해외 공장을 짓고 있습니다.\n[엔터 ⏎ 다음 장]","notes":"· 입장하면 누적 판매량 선이 그려진다. 엔터 1: 해외 매출 막대 → 엔터 2: 생산·시장 카드.\n· 누적 판매량: 데일리안(2022.08.01) 2017년 10억, 2019년 20억, 2021년 30억, 2022년 40억 개(불닭브랜드 면 제품). 세계일보(2024.01.16) ‘지난해 3분기까지 … 누적 판매량 53억개’. 토요경제(2025.09.24) 2025년 상반기 누적 80억 개(불닭볶음면 시리즈), 100여 개국. 연도 간격이 고르지 않다.\n· 해외 매출: 머니투데이(2025.12.04) 그래픽 ‘삼양식품 해외 매출과 비중’(자료: 삼양식품) 2020년 3703억원 57%, 2021년 3885억원 61%, 2022년 6050억원 67%, 2023년 8093억원 68%, 2024년 1조3359억원 77%. 이 수치는 삼양식품 전체의 해외 매출이며 불닭만의 매출은 아니다(세계일보: 해외 매출의 80%가 불닭 브랜드).\n· 생산: 데일리안(2022.05.02) 밀양공장 수출 전용, 연간 최대 6억 개. 머니투데이(2025.12.04) ‘2014억원을 투자해 중국 자싱시에 첫 해외 생산공장을 건립 중’, ‘자싱공장을 포함해 국내·외 5개 공장의 연간 불닭볶음면 생산량은 38억개로 늘어난다’.\n· ‘해외 매출이 커지자 생산을 넓혔다’는 연결은 기사 내용을 바탕으로 한 저희 조의 정리다."},
    {"id":"p7","type":"case","duration":51,"title":"사례 ② 삼성전자 갤럭시 폴드 · 강의자료 밖 기사 사례","lead":"출시 직전 문제가 드러나 [[설계 보완과 추가 검증]]으로 돌아갔다","img":{"src":"https://img.kr.news.samsung.com/kr/wp-content/uploads/2019/09/0905-pr-fold-1.jpg","caption":"갤럭시 폴드 (사진: 삼성전자 뉴스룸)","pos":"50% 50%"},"stats":[{"n":4,"u":"가지","l":"공식 발표의 주요 설계 보강"}],"steps":[{"stage":"제품 공개","when":"2019.02","what":"화면을 접는 스마트폰 갤럭시 폴드 공개"},{"stage":"문제 발견","when":"2019.04","what":"미국 출시 전 리뷰용 제품에서 화면 손상: 접히는 부분 상·하단 충격과 이물질"},{"stage":"출시 연기","when":"2019.04.23","what":"문제 점검과 내부 테스트 추가 진행을 위해 [[출시 연기]]"},{"stage":"설계 보완 · 추가 검증","when":"2019.07","what":"보호막 베젤 밖까지 연장, 힌지 보호 캡, 디스플레이 뒷면 금속층, 힌지-본체 틈 축소 → 최종 테스트","back":true},{"stage":"국내 첫 출시","when":"2019.09.06","what":"설계 보완 후 국내 첫 출시"}],"groupAt":[1,1,1,2,3],"caveat":"기사·공식 발표로 확인한 사실 · 설계 보완을 제품 엔지니어링에 연결한 것은 조 해석","lesson":"검증에서 문제가 드러나자 [[출시를 미루고 설계를 보완]]했다","sources":[{"label":"뉴시스 2019.04.23","url":"https://www.newsis.com/view/NISX20190423_0000629863"},{"label":"Samsung Newsroom 2019.07.24","url":"https://news.samsung.com/us/galaxy-fold-ready-for-launch-september-2019/"},{"label":"삼성전자 뉴스룸 2019.09.05","url":"https://news.samsung.com/kr/%ec%82%bc%ec%84%b1%ec%a0%84%ec%9e%90-%ec%83%88%eb%a1%9c%ec%9a%b4-%eb%aa%a8%eb%b0%94%ec%9d%bc-%ec%b9%b4%ed%85%8c%ea%b3%a0%eb%a6%ac%eb%a5%bc-%ec%97%ac%eb%8a%94-%ea%b0%a4%eb%9f%ad%ec%8b%9c"}],"script":"두 번째는 갤럭시 폴드입니다. 불닭이 고객 수요에서 출발했다면, 폴드는 접는 화면이라는 새 기술에서 출발했습니다.\n[엔터 ⏎ 공개 · 문제 발견 · 출시 연기] 2019년 2월 공개 후 미국 출시를 앞두고 리뷰용 제품에서 화면 손상이 나왔습니다. 삼성전자는 4월 23일 내부 테스트를 더 하겠다며 출시를 미뤘습니다.\n[엔터 ⏎ 설계 보완 · 추가 검증] 7월에는 보호막 연장, 힌지 보호 캡, 금속층 추가, 틈 축소의 네 가지 보강을 발표했습니다. 저희는 제품 엔지니어링으로 돌아간 것으로 봤습니다.\n[엔터 ⏎ 국내 첫 출시] 그리고 9월 6일 국내에 처음 출시됐습니다.\n[엔터 ⏎ 다음 장]","notes":"· 엔터 1: 제품 공개·문제 발견·출시 연기 → 엔터 2: 설계 보완·추가 검증 → 엔터 3: 국내 첫 출시.\n· 제품 공개: 서울신문(2019.02.21) https://m.seoul.co.kr/news/2019/02/21/20190221500035\n· 출시 연기: 뉴시스(2019.04.23) https://www.newsis.com/view/NISX20190423_0000629863 연기 사유 ‘갤럭시 폴드 리뷰 과정에서 드러난 문제를 점검하고 내부 테스트를 추가로 진행하기 위해’, 원인 ‘접히는 부분의 상·하단 디스플레이 노출부 충격과 이물질에 의한 디스플레이 손상’. 원래 일정은 미국 4월 26일.\n· 설계 보강: Samsung Newsroom(미국, 2019.07.24) https://news.samsung.com/us/galaxy-fold-ready-for-launch-september-2019/ 디스플레이 상단 보호막을 베젤 밖까지 연장, 힌지 위아래에 보호 캡 추가, 디스플레이 아래에 금속층 추가, 힌지와 본체 사이 틈 축소. 국내 보도: 바이라인네트워크(2019.07.25) https://byline.network/2019/07/25-66\n· 국내 첫 출시: 삼성전자 뉴스룸(2019.09.05) ‘6일 국내에서 첫 출시’.\n· 리뷰용 제품을 알파·베타 시제품이라고 말하지 않는다."},
    {"id":"p7b","type":"foldgen","duration":51,"title":"사례 ② 갤럭시 폴드, 출시 그 후","lead":"이전 세대의 [[약점을 고치고]], [[새로운 모양의 제품]]으로 이어졌다","chartLabel":"접었을 때 두께 (mm)","models":[{"name":"폴드","sub":"2019 · 276g","v":17.1},{"name":"Z폴드2","sub":"2020 · 282g","v":16.8},{"name":"Z폴드3","sub":"2021 · 271g","v":16},{"name":"Z폴드4","sub":"2022 · 263g","v":15.8},{"name":"Z폴드5","sub":"2023 · 253g","v":13.4},{"name":"Z폴드6","sub":"2024 · 239g","v":12.1},{"name":"Z폴드7","sub":"2025 · 215g","v":8.9}],"fixes":[{"tag":"약점: 이물질","t":"Z폴드2 · 힌지 먼지를 쓸어 내는 ‘스위퍼’","at":[1]},{"tag":"약점: 물·충격","t":"Z폴드3 · 폴더블 최초 방수(IPX8)","at":[2]},{"tag":"약점: 두께·주름","t":"Z폴드4~7 · 힌지 재설계","at":[3,4,5,6]}],"newLabel":"새로운 모양의 신제품으로","news":[{"when":"2020.02","name":"갤럭시 Z 플립","t":"‘Z 시리즈’ 첫 제품 · 세계 최초 UTG 적용","img":{"src":"https://img.global.news.samsung.com/global/wp-content/uploads/2020/02/Press-Thumbnail-1000x563-Galaxy-Z-Flip.jpg","caption":"갤럭시 Z 플립","pos":"50% 50%"}},{"when":"2025.12","name":"갤럭시 Z 트라이폴드","t":"두 번 접는 10형 화면 · 접으면 12.9mm","img":{"src":"https://img.kr.news.samsung.com/kr/wp-content/uploads/2025/12/02091913/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90-%EB%AA%A8%EB%B0%94%EC%9D%BC-%EA%B0%A4%EB%9F%AD%EC%8B%9CZ%ED%8A%B8%EB%9D%BC%EC%9D%B4%ED%8F%B4%EB%93%9C-%EA%B3%B5%EA%B0%9C-1.jpg","caption":"갤럭시 Z 트라이폴드","pos":"50% 50%"}},{"when":"2026.07","name":"갤럭시 Z 폴드8","t":"4:3 비율의 넓은 화면 · 201g","img":{"src":"https://img.kr.news.samsung.com/kr/wp-content/uploads/2026/10/22141046/Galaxy-Z-Fold8_PC_1022.jpg","caption":"갤럭시 Z 폴드8","pos":"50% 50%"}}],"lesson":"이전 세대의 [[약점]] → 다음 세대의 [[목표]] → [[새로운 신제품]] (조 해석)","sources":[{"label":"삼성전자 뉴스룸 2024.06.27 · 2025.12.02","url":"https://news.samsung.com/kr/갤럭시-히스토리-①-z-폴드-더욱-얇게-빈틈없이-그리"},{"label":"데일리안 2025.07.09","url":"https://www.dailian.co.kr/news/view/1520379"},{"label":"아이뉴스24 2020.02.12","url":"https://www.inews24.com/view/1242004"},{"label":"파이낸셜뉴스 2026.07.22","url":"https://www.fnnews.com/news/202607221825230263"}],"script":"폴드는 출시 뒤에도 계속 개선됐습니다. 세대별로 접었을 때의 두께입니다.\n[엔터 ⏎ 이물질] 첫 폴드의 문제였던 이물질은 Z폴드2의 ‘스위퍼’로 막았고,\n[엔터 ⏎ 물·충격] Z폴드3는 폴더블폰 최초로 방수를 지원했습니다.\n[엔터 ⏎ 두께] 이후 힌지를 다시 설계해 17.1mm였던 두께가 Z폴드7에서 8.9mm, 약 절반이 됐습니다.\n[엔터 ⏎ 새로운 신제품] 그리고 새로운 모양의 제품으로도 이어졌습니다. 2020년 Z 시리즈의 첫 제품인 Z플립, 2025년 두 번 접는 트라이폴드, 2026년 7월 넓은 화면의 Z폴드8이 나왔습니다.\n[엔터 ⏎ 다음 장]","notes":"· 엔터 1~3: 약점과 개선이 해당 세대 위에 나타나고 그 막대가 강조된다. 엔터 4: 오른쪽 새 제품 3개.\n· 두께·무게: 삼성전자 뉴스룸 「[갤럭시 히스토리 ①] Z 폴드」(2024.06.27) 폴드~Z폴드5, Z폴드2 스위퍼, Z폴드3 방수, Z폴드4 힌지 재설계, Z폴드5 물방울 형태 힌지. 서울신문(2021.08.11) Z폴드3 폴더블폰 최초 IPX8 방수. 데일리안(2025.07.09) Z폴드7 8.9mm·215g, 전작보다 3.2mm 얇고 24g 가볍다. Z폴드6 값(12.1mm·239g)은 이 ‘전작 대비’ 수치로 계산한 값이다. 두께는 접었을 때 가장 두꺼운 곳 기준. (17.1 − 8.9) ÷ 17.1 ≈ 48%.\n· Z플립: 아이뉴스24(2020.02.12) ‘11일(현지시간) … 갤럭시 언팩 2020에서 공개’, ‘갤럭시 Z 시리즈의 첫 제품이라는 것이 회사 측의 설명’, ‘세계 최초로 UTG(울트라 씬 글래스)를 적용’, 국내 출시 14일.\n· Z 트라이폴드: 삼성전자 뉴스룸(2025.12.02) 메인 253.1mm(10.0형), 커버 6.5형, 접었을 때 12.9mm, 309g, 12일 국내 출시, 359만 400원.\n· Z폴드8: 파이낸셜뉴스(2026.07.22) 22일(현지시간) 영국 런던 ‘갤럭시 언팩 2026’에서 공개, 4대 3 화면비, 무게 201g. 같은 날 공개된 Z폴드8 울트라는 접었을 때 8.9mm, 215g이라 두께 그래프에는 넣지 않았다.\n· ‘이전 세대의 약점이 다음 세대의 목표가 됐다’는 연결은 저희 조의 해석이다(36장의 목표 스펙 설정과 연결해 생각해 볼 수 있다)."},
    {"id":"p8","type":"table","duration":23,"title":"사례 · 정리","lead":"두 사례 모두 [[출시 전 검증]], [[출시 후 개선]]이 이어졌다","cols":["불닭볶음면","갤럭시 폴드"],"colImgs":[{"src":"https://img1.newsis.com/2022/04/15/NISI20220415_0000975724_web.jpg","caption":"불닭볶음면"},{"src":"https://img.kr.news.samsung.com/kr/wp-content/uploads/2019/09/0905-pr-fold-1.jpg","caption":"갤럭시 폴드"}],"rows":[{"h":"출발점","a":"고객의 매운맛 수요","b":"새로운 기술 (접는 화면)"},{"h":"출시 전 (확인한 사실)","a":"약 1년간 시식·수정 반복","b":"문제 발견 → 출시 연기, 설계 보완, 추가 테스트"},{"h":"출시 후 (확인한 사실)","a":"19종 시리즈, 나라별 버전, 해외 매출 비중 77%","b":"세대마다 두께·내구성 개선, Z플립·트라이폴드 등 새 제품"},{"h":"확인하지 못한 것","a":"첫 제품의 공정 엔지니어링·시장진출 준비","b":"공정 엔지니어링·시장진출 준비 과정"},{"h":"수업 단계 연결 (조 해석)","a":"개념 정립 → 제품 개발·개선","b":"제품 엔지니어링으로 돌아가 설계·신뢰성 보완"}],"commonLabel":"시사점 (조 해석)","common":"개발 과정에는 [[검증과 개선]]이 필요하고, 문제가 있으면 [[이전 단계로 돌아가며]], 출시 뒤의 개선은 [[다음 신제품]]으로 이어진다","sources":[],"script":"두 사례를 정리하면, 출발점은 고객 수요와 새 기술로 달랐지만, 둘 다 출시 전에 검증하고 고쳤습니다. 출시 뒤에도 불닭은 맛과 나라를 넓혔고, 폴드는 세대마다 약점을 고쳐 새 제품으로 이어졌습니다.\n[엔터 ⏎ 다음 장]","notes":"· ‘수업 단계 연결’과 ‘시사점’ 줄은 저희 조의 해석이며 강의자료의 문구가 아니다.\n· 두 회사가 모든 단계를 빠짐없이 수행했다고 말하지 않는다."},
    {
      id: "q8", type: "context", duration: 72,
      title: "왜 절차가 필요한가 · 31장",
      lead: "대부분의 아이디어는 [[신제품으로 이어지지 않는다]]",
      tunnelLabel: "혁신의 터널 · 31장 그림 1.3 ‘제약 산업에서의 신제품 개발 터널’",
      tunnel: [{ n: "5,000개", t: "화합물" }, { n: "125개", t: "선행 약품" }, { n: "2~3개", t: "시험 약품" }, { n: "1개", t: "약품" }],
      periods: [{ h: "발견과 사전임상시험", t: "3~6년", w: 5 }, { h: "임상시험", t: "6~7년", w: 3 }, { h: "허가", t: "1/2~2년", w: 2 }],
      quotes: [
        { t: "성공적인 혁신: 신중하게 설계된 [[전략과 구현 프로세스]]가 필요함", c: "31장" },
        { t: "신제품 개발의 실패율이 높게는 95%", c: "7강 「시장 진입 시기」 5장" }
      ],
      chasmLabel: "출시 이후 · 기술의 확산 곡선 & Chasm",
      chasmText: "그림은 Early Adopters와 Early Majority 사이에 THE CHASM(변곡점)을 두고, 왼쪽에 ‘대중화 실패 Ex. Google Glass, 3D 프린터 등’이라고 적었다.",
      chasmNote: "「혁신의 원천 및 유형과 패턴」 42장 · 시장 확산에 관한 그림이라 개발 절차와는 구분",
      sources: [{ label: "「경영프로젝트의 개발」 31장, 7강 「시장 진입 시기」 5장, 「혁신의 원천 및 유형과 패턴」 42장", url: "" }],
      script: "그렇다면 왜 이런 절차가 필요할까요? 31장의 혁신의 터널은 의약품 예시입니다. 화합물 5,000개가 선행 약품 125개, 시험 약품 2~3개를 거쳐 약품 1개가 되고, 그림 아래에는 단계별로 몇 년씩 걸리는 기간이 적혀 있습니다.\n강의자료는 대부분의 혁신적인 아이디어가 성공적인 신제품으로 이어지지 않으며, 성공적인 혁신에는 신중하게 설계된 전략과 구현 프로세스가 필요하다고 설명합니다. 7강 5장에도 신제품 개발의 실패율이 높게는 95%라고 나옵니다.\n[엔터 ⏎ 보충: 캐즘] 보충으로, 「혁신의 원천」 42장 확산 곡선은 캐즘 왼쪽에 ‘대중화 실패’라고 적고 Google Glass, 3D 프린터 등을 예로 듭니다. 출시 뒤 시장 확산에 관한 그림이라 개발 절차와는 구분합니다.\n[엔터 ⏎ 다음 장]",
      notes: "· 입장하면 터널과 기간 막대가 나타난다. 엔터 1: 오른쪽 캐즘 보충(약 20초).\n· 31장 원문: ‘성공적인 혁신: 신중하게 설계된 전략과 구현 프로세스가 필요함’, ‘혁신의 터널: 대부분의 혁신적인 아이디어는 성공적인 신제품으로 이어지지 않음’, ‘예: 의약품의 신제품 개발 유입경로’. 그림 1.3의 숫자와 기간(발견과 사전임상시험 3~6년, 임상시험 6~7년, 허가 1/2~2년)은 그림 원본을 직접 확인했다.\n· 31장 발표자 노트: ‘혁신터널 9개 프로젝트중 1개만 성공, 제약은 FDA승인 받고 신약 성공할 때까지 14억과 10년의 긴 혁신 터널이 필요함’. 화면에는 넣지 않았고, 질문이 나오면 ‘31장 노트’라고 밝히고 말한다.\n· 7강 5장 원문: ‘최초 진입자의 단점 – 높은 연구 개발 비용 – 신제품 개발의 실패율이 높게는 95%’. 최초 진입자의 단점을 설명하는 맥락이다.\n· 그림의 숫자를 모든 산업의 성공률로 말하지 않는다.\n· 캐즘: 42장 그림에 적힌 것은 구간 이름과 비율(Innovators 2.5%, Early Adopters 13.5%, Early Majority 34%, Late Majority 34%, Late Mass 16%), ‘THE CHASM(변곡점)’, ‘대중화 실패 Ex. Google Glass, 3D 프린터 등’, ‘대중화 본격화’뿐이다. 3D 프린터 전체가 실패했다거나 캐즘에 머물렀다고 말하지 않는다. 캐즘과 ‘고객 니즈 확인·검증의 중요성’을 잇는 주장은 강의자료에 없으므로 하지 않는다."

        { h: "만들 수 있게 다듬는다", t: "설계 품질을 확보하고 양산성을 높인 뒤, 시험생산으로 제조품질을 확립한다", src: "35장 3·4단계" },
        { h: "시장에 내놓는다", t: "영업을 준비하고, 생산·영업 체제를 조기에 확립해 안정시킨다", src: "35장 5·6단계" }
      ],
      final: "‘성공적인 혁신에는 신중하게 설계된 전략과 구현 프로세스가 필요함’ (31장)",
      sources: [{ label: "「경영프로젝트의 개발」 31장, 35~37장 · 세 묶음의 이름은 발표자 정리", url: "" }],
      script: "정리하겠습니다. 신제품 개발 절차는 개념 정립, 제품 설계, 제품 엔지니어링, 공정 엔지니어링, 시장진출 준비, 대량 생산의 여섯 단계입니다.\n[엔터 ⏎ 세 가지 정리] 저희 식으로 묶으면, 먼저 니즈에 맞는 개념을 정하고 목표 스펙과 최적 설계안을 결정합니다. 다음으로 설계 품질을 확보하고 양산성을 높인 뒤, 시험생산으로 제조품질을 확립합니다. 마지막으로 영업을 준비하고 생산과 영업 체제를 안정시킵니다.\n[엔터 ⏎ 31장 문장] 강의자료 31장의 말처럼, 성공적인 혁신에는 신중하게 설계된 전략과 구현 프로세스가 필요합니다. 이상이 토론 문제 4번에 대한 저희의 답입니다.\n[엔터 ⏎ 다음 장]",
      notes: "· 입장하면 6단계가 차례로 켜진다. 엔터 1: 세 가지 정리 → 엔터 2: 31장 문장.\n· 세 묶음의 제목(무엇을 만들지 정한다 등)은 저희가 정리한 표현이고, 각 카드의 내용은 35장 원문 범위다. 1번 카드의 출처에 36~37장을 함께 적은 것은 36장의 ‘목표 스펙’과 37장의 컨셉 선정을 앞 단계와 연결한 저희의 해석이 들어 있기 때문이다.\n· 이전 발표안의 ‘문제가 생기면 이전 단계로 돌아간다’는 화살표는 강의자료에 근거가 없어 지웠다."

/* 02 혁신의 터널: 아이디어 입자가 흘러 들어가 대부분 사라지고 하나만 빠져나온다 */
R.funnel = (s, i) => {

    const endY = win ? 120 : yAt(endX, y0) + (rnd1(k + 90) > .5 ? 1 : -1) * (18 + rnd1(k + 7) * 34);
    const midX = (10 + endX) / 2, d = `M-10 ${y0.toFixed(0)} Q${midX.toFixed(0)} ${yAt(midX, y0).toFixed(0)} ${endX.toFixed(0)} ${endY.toFixed(0)}`;
    const dur = ((win ? 4.2 : 2.6) + rnd1(k + 3) * 1.4).toFixed(2), beg = (rnd1(k + 11) * 4.5).toFixed(2);
    parts += `<circle r="${win ? 6.5 : 4}" class="tn-p${win ? " win" : ""}" opacity="0"><animateMotion dur="${dur}s" begin="${beg}s" repeatCount="indefinite" path="${d}"/><animate attributeName="opacity" dur="${dur}s" begin="${beg}s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;${win ? ".9;.98" : ".62;.8"};1"/></circle>`;
  }
  return `${head(s, i)}<div class="s-body funnel2">

/* 02 캐즘: 강의자료 42장 기술의 확산 곡선을 다시 그림 */
R.chasm = (s, i) => {
  const seg = s.segs || [], G = 64, x0 = 40, x1 = 1000 - 40 - G, sd = (x1 - x0) / 6.4;
  const X = z => x0 + (z + 3.2) * sd + (z > -1 ? G : 0), base = 300, K = 600;
  const pdf = z => Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI);
  const cuts = [-3.2, -2, -1, 0, 1, 3.2];
  const segPath = k => { const a = cuts[k], b = cuts[k + 1]; let d = `M${X(a + (k === 2 ? 0.0001 : 0)).toFixed(1)} ${base}`;
    for (let z = a; z <= b + 1e-9; z += 0.05) { const zz = Math.min(z, b); d += ` L${X(k === 2 && zz <= -1 ? -0.9999 : zz).toFixed(1)} ${(base - pdf(zz) * K).toFixed(1)}`; }
    return d + ` L${X(b).toFixed(1)} ${base} Z`; };
  const fills = ["var(--c-violet)", "var(--c-blue)", "var(--c-teal)", "var(--c-orange)", "var(--c-coral)"];
  const cx = X(-1) + G / 2;
  let cum = ""; for (let z = -3.2; z <= 3.2; z += 0.1) { const c = 0.5 * (1 + erf1(z / Math.SQRT2)); cum += `${cum ? " L" : "M"}${X(z).toFixed(1)} ${(base - 30 - c * 230).toFixed(1)}`; }
  return `${head(s, i)}<div class="s-body chasm">
  <div class="cz-wrap rise"${rise(1)}>
    <svg class="cz-svg" viewBox="0 0 1000 380" aria-hidden="true">
      <path class="cz-cum" d="${cum}" pathLength="1"/>
      <g class="cz-left">${[0, 1].map(k => `<path class="cz-seg" d="${segPath(k)}" style="--c:${fills[k]};--k:${k}"/>`).join("")}</g>
      <g class="cz-right">${[2, 3, 4].map(k => `<path class="cz-seg" d="${segPath(k)}" style="--c:${fills[k]};--k:${k}"/>`).join("")}</g>
      <line x1="30" x2="970" y1="${base}" y2="${base}" class="cz-axis"/>
      <g class="cz-gap"><rect x="${(cx - G / 2 + 6).toFixed(1)}" y="40" width="${G - 12}" height="${base - 36}" class="cz-gaprect"/>
        <path class="cz-crack" d="M${cx} 40 l-8 40 l12 30 l-10 38 l10 40 l-8 44 l6 70" pathLength="1"/>
        <text x="${cx}" y="34" class="cz-gt">THE CHASM</text></g>
    </svg>
    <div class="cz-labels">${seg.map((g, k) => { const a = X(cuts[k] + (k === 2 ? 0.0001 : 0)), b = X(cuts[k + 1]);
      return `<div class="cz-lb${k < 2 ? " l" : " r"}" style="left:${(a / 10).toFixed(2)}%;width:${((b - a) / 10).toFixed(2)}%;--c:${fills[k]};--k:${k}">
        <b><span data-count="${+g.p}" data-dec="${String(g.p).includes(".") ? 1 : 0}" data-delay="${600 + k * 260}">${esc(g.p)}</span>%</b><span class="en" data-k="segs.${k}.en">${esc(g.en)}</span><span class="ko" data-k="segs.${k}.ko">${esc(g.ko)}</span></div>`; }).join("")}</div>
    <div class="cz-fail frag" data-f="1">
      <b class="cz-ft">${icon("down")}<span data-k="fail.h">${esc((s.fail || {}).h)}</span></b>
      <div class="cz-ex">${((s.fail || {}).ex || []).map((e, k) => `<figure>${photo(s, `fail.ex.${k}.img`, "cz-exph")}<figcaption data-k="fail.ex.${k}.name">${esc(e.name)}</figcaption></figure>`).join("")}</div>
      <span class="cz-fs" data-k="fail.src">${esc((s.fail || {}).src || "")}</span>
    </div>
    <div class="cz-ok frag" data-f="1"><b>${icon("star")}<span data-k="okLabel">${esc(s.okLabel)}</span></b></div>
    <span class="cz-chasm-lb frag" data-f="1" style="left:${(cx / 10).toFixed(2)}%" data-k="chasmLabel">${esc(s.chasmLabel)}</span>
  </div>
  <div class="cz-bottom frag" data-f="2">${icon("arrow")}${ed(s, "bottom", "span")}</div>
</div>${foot(s, i)}`;
};
function erf1(x) { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; }

R.foldgen = (s, i) => {

  const first = M[0] || {}, last = M[n - 1] || {}, pct = first.v ? Math.round((1 - last.v / first.v) * 100) : 0;

function slideHTML(s, i) {
