<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신제품 개발 절차 발표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 1600x900 고정 무대를 화면에 맞춰 축소. 흰 슬라이드 위에 단계·데이터마다 고유 색을 배정한 밝은 단일 테마. */
:root{
  --void:#E8ECF3;
  --bg:#FFFFFF;
  --surface:#F5F7FB;
  --raise:#EDF1F7;
  --line:#E3E8F0;
  --line-2:#CBD3E0;
  --ink:#0F1A2C;
  --ink-2:#47546A;
  --ink-3:#8792A6;
  --accent:#2F6BFF;
  --accent-ink:#2F6BFF;
  --accent-soft:#E8EFFF;
  --teal:#0E9E91;
  --teal-soft:#E3F6F3;
  --edit:#C77700;
  --edit-soft:#FFF3DF;
  --edit-line:#F0B04A;
  --danger:#E5484D;
  --c-coral:#F2545B;
  --c-orange:#FF8A2B;
  --c-violet:#7B5CFA;
  --c-teal:#12A594;
  --c-blue:#2F6BFF;
  --c-sky:#1AA3E8;
  --shadow:0 1px 2px rgba(15,26,44,.06),0 18px 50px rgba(15,26,44,.12);
  --font-display:"Pretendard Variable","Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Pretendard Variable","Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);font-size:15px;margin:0;overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 앱 골격 ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--raise);color:var(--ink-2);white-space:nowrap}
body.editing .mode-chip{color:var(--edit);background:var(--edit-soft)}
.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--raise);color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
#btnEdit[aria-pressed="true"]{background:var(--edit-soft);color:var(--edit)}
.btn.solid{background:var(--bg);border-color:var(--line-2);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.small{height:30px;padding:0 10px;font-size:13px}

.workspace{position:relative;display:flex;min-height:0;min-width:0}
.viewport{position:relative;flex:1;min-width:0;display:grid;place-items:center;overflow:hidden;padding:20px}
.stage-wrap{position:relative}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--bg);box-shadow:var(--shadow);border-radius:14px;overflow:hidden}
body.editing .stage{box-shadow:0 0 0 3px var(--edit-line),var(--shadow)}

/* ---------- 하단 조작부 ---------- */
.controls{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:14px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn svg{width:18px;height:18px}
.counter{font-family:var(--font-mono);font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b{color:var(--ink);font-weight:600}
.progress{display:flex;gap:3px;height:6px;min-width:0}
.progress .seg{position:relative;height:100%;background:var(--raise);border-radius:3px;overflow:hidden;cursor:pointer;min-width:6px}
.progress .seg i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--c-sky),var(--c-blue),var(--c-violet));background-size:var(--bw,100%) 100%;transition:width .35s ease}
.timer{font-family:var(--font-mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.bad{color:var(--danger)}

/* ---------- 대본 바 ---------- */
.script-bar{border-top:1px solid var(--line);background:var(--bg);padding:12px 16px;max-height:24vh;overflow:auto}
.script-head{display:flex;gap:12px;align-items:baseline;margin-bottom:6px;font-size:12px;color:var(--ink-3);font-weight:600}
.script-text{font-size:17px;line-height:1.75;color:var(--ink);white-space:pre-line;max-width:72em;outline:none}
body.editing .script-text{border:1px dashed var(--edit-line);border-radius:6px;padding:6px 8px}

/* ---------- 서랍(메모·편집) ---------- */
.drawer{width:380px;flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:14px;font-weight:700;margin:0;flex:1}
.drawer-body{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.notes-title{font-size:13px;color:var(--ink-3);font-weight:600}
.notes-text{font-size:16px;line-height:1.7;white-space:pre-line;color:var(--ink)}
.notes-next{font-size:13px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 10px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;font-weight:600}
.tab[aria-selected="true"]{color:var(--edit);border-bottom-color:var(--edit)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld-label{font-size:12px;color:var(--ink-3);font-weight:500}
.fld input,.fld textarea,.fld select,.mini input{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;min-width:0;width:100%;box-sizing:border-box}
.fld textarea{min-height:76px;resize:vertical;line-height:1.55}
.fld input:focus,.fld textarea:focus,.fld select:focus,.mini input:focus{outline:none;border-color:var(--edit-line);background:var(--bg)}
.group{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.group-title{font-size:12px;font-weight:700;color:var(--ink-2)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr)) auto;gap:6px;align-items:end}
.row .x{width:30px;height:34px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink-3);border-radius:8px;cursor:pointer}
.mini{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini span{font-size:11px;color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.55}
.img-prev{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.slide-list{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.slide-list li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 6px 6px 8px;border-radius:8px;border:1px solid transparent}
.slide-list li.cur{border-color:var(--line-2);background:var(--surface)}
.slide-list .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.slide-list .t{font-size:13px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slide-list .t small{display:block;color:var(--ink-3);font-family:var(--font-mono);font-size:11px}
.slide-list .acts{display:flex;gap:2px}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border:0;background:none;color:var(--ink-3);border-radius:6px;cursor:pointer}
.icon-btn:hover{background:var(--raise);color:var(--ink)}
.icon-btn.confirm{background:var(--danger);color:var(--bg)}
.icon-btn svg{width:16px;height:16px}
.json-box{font-family:var(--font-mono);font-size:11px;min-height:120px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.confirm-box{border:1px solid var(--danger);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(560px,calc(100vw - 32px));z-index:50;box-shadow:var(--shadow)}

/* ---------- 발표 모드 ---------- */
body.presenting .topbar,body.presenting .drawer{display:none}
body.presenting .viewport{padding:0;background:var(--bg)}
body.presenting .stage{box-shadow:none;border-radius:0}
body.presenting .controls{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));border:1px solid var(--line-2);border-radius:14px;opacity:0;transition:opacity .25s;z-index:20;box-sizing:border-box;box-shadow:var(--shadow)}
body.presenting.show-ctrl .controls,body.presenting .controls:focus-within{opacity:1}
body.presenting .script-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:22vh}
.exit-present{display:none}
body.presenting .exit-present{display:inline-flex}

/* ---------- 슬라이드 공통 ---------- */
.slide{position:absolute;inset:0;padding:64px 96px 50px;display:flex;flex-direction:column;box-sizing:border-box;opacity:0;visibility:hidden;transform:translateX(24px);transition:opacity .34s ease,transform .34s cubic-bezier(.2,.7,.2,1),visibility 0s linear .34s;background:var(--bg);overflow:hidden}
.slide::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--c-coral),var(--c-orange) 25%,var(--c-violet) 55%,var(--c-blue) 78%,var(--c-teal))}
.slide.is-active{opacity:1;visibility:visible;transform:none;transition:opacity .34s ease,transform .34s cubic-bezier(.2,.7,.2,1)}
.slide.from-left{transform:translateX(-24px)}
.s-head{display:flex;flex-direction:column;gap:16px;margin-bottom:38px}
.eyebrow{display:flex;gap:14px;align-items:center;font-size:21px;color:var(--ink-3)}
.eyebrow .no{font-family:var(--font-mono);font-weight:600;font-size:18px;color:var(--bg);background:var(--ink);border-radius:999px;padding:4px 12px;letter-spacing:.02em}
.eyebrow [data-k]{font-weight:600;color:var(--ink-2)}
.lead{font-family:var(--font-display);font-size:56px;line-height:1.22;font-weight:800;letter-spacing:-.035em;margin:0;max-width:1360px;text-wrap:balance;white-space:pre-line;color:var(--ink)}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column}
.s-body.center{justify-content:center}
.s-foot{display:flex;justify-content:space-between;gap:40px;align-items:flex-end;border-top:1px solid var(--line);padding-top:14px;margin-top:22px;font-size:16px;line-height:1.5;color:var(--ink-3)}
.s-foot .src{display:flex;flex-direction:column;gap:2px;min-width:0}
.s-foot a{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;word-break:break-all}
.s-foot .pg{font-family:var(--font-mono);font-size:15px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:10px;font-size:19px;line-height:1.35;padding:9px 16px;border-radius:10px;background:var(--surface);color:var(--ink-2);white-space:pre-line;font-weight:500}
.tag.teal{color:var(--teal);background:var(--teal-soft)}
.tag.warn{background:#FFF1F1;color:#B4232A}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
.tag svg{width:22px;height:22px;flex:none}
.body-text{font-size:28px;line-height:1.55;color:var(--ink-2);white-space:pre-line}
.tint{background:color-mix(in srgb,var(--c) 9%,white)}

/* 단계 표시(프래그먼트) */
.frag{transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.2,1)}
.slide:not(.show-all) .frag:not(.on){opacity:0;transform:translateY(14px)}
.hl-item{transition:opacity .3s ease,color .3s ease,border-color .3s ease,background .3s ease}
.slide.has-hl .hl-item:not(.hl){opacity:.32}
.slide:not(.show-all) .frag.hl-item:not(.on){opacity:0}
.slide.has-hl .band:not(.hl),.slide.has-hl .seg-hl:not(.hl){opacity:0}

/* 편집 모드 */
.edit-only{display:none!important}
body.editing .edit-only{display:inline-flex!important}
body.editing .slide [data-k]{outline:1.5px dashed var(--edit-line);outline-offset:4px;border-radius:3px;cursor:text}
body.editing .slide [data-k]:focus{outline:2.5px solid var(--edit);background:var(--edit-soft)}
.img-edit{position:absolute;top:14px;right:14px;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;border:0;background:var(--edit);color:#fff;font-size:18px;font-weight:600;cursor:pointer;z-index:2}

/* 1장 표지 */
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:64px;height:100%}
.cover-l{display:flex;flex-direction:column;min-width:0;padding-top:6px}
.cover-q{font-family:var(--font-display);font-size:64px;line-height:1.2;font-weight:800;letter-spacing:-.04em;margin:30px 0 0;text-wrap:balance;white-space:pre-line;background:linear-gradient(100deg,var(--ink) 40%,var(--c-blue) 75%,var(--c-violet));-webkit-background-clip:text;background-clip:text;color:transparent}
body.editing .cover-q{color:var(--ink);background:none}
.cover-cases{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.cover-cases span{font-size:22px;font-weight:600;padding:8px 16px;border-radius:999px;white-space:pre-line}
.cover-meta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.cover-title{font-size:34px;font-weight:800;line-height:1.3;letter-spacing:-.02em;white-space:pre-line}
.cover-sub{font-size:24px;color:var(--ink-2);white-space:pre-line}
.cover-by{font-size:20px;color:var(--ink-3);margin-top:8px}
.cover-r{display:grid;grid-template-rows:1fr 1fr auto;gap:18px;min-width:0;min-height:0}
.fig{position:relative;margin:0;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.fig .media{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:var(--surface);display:grid;place-items:center;color:var(--ink-3)}
.fig .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fig .media .fb{width:82%;height:82%;display:none}
.fig .media.no-img .fb,.fig .media.img-fail .fb{display:block}
.fig .media.img-fail img{display:none}
.fig .media .chip-tag{position:absolute;left:16px;top:16px;font-size:17px;font-weight:700;color:#fff;padding:6px 12px;border-radius:999px;background:var(--c)}
.fig figcaption{display:flex;justify-content:space-between;gap:16px;font-size:17px;color:var(--ink-2)}
.fig figcaption .credit{color:var(--ink-3);text-align:right}
.cover-note{font-size:16px;color:var(--ink-3);line-height:1.5;margin:0}

/* 흐름도(2·4장) */
.flow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:22px;position:relative}
.node{position:relative;display:flex;flex-direction:column;gap:12px;padding:28px 28px 30px;border-radius:20px;background:color-mix(in srgb,var(--c) 8%,white);border:1px solid color-mix(in srgb,var(--c) 22%,white)}
.node::after{content:"";position:absolute;right:-17px;top:50%;width:12px;height:12px;border-top:3px solid var(--line-2);border-right:3px solid var(--line-2);transform:translateY(-50%) rotate(45deg);z-index:1}
.node:last-child::after{display:none}
.node .ic{width:52px;height:52px;color:var(--c);padding:10px;border-radius:14px;background:var(--bg);box-sizing:border-box;box-shadow:0 1px 2px rgba(15,26,44,.06)}
.node .nk{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--c)}
.node .nl{font-size:35px;font-weight:800;line-height:1.22;letter-spacing:-.03em;white-space:pre-line;color:var(--ink)}
.node .nd{font-size:23px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.node.key{background:var(--c);border-color:var(--c)}
.node.key .nl,.node.key .nd,.node.key .nk{color:#fff}
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:36px;align-items:center;margin-top:auto;padding:30px 40px;border-radius:20px;background:var(--surface)}
.versus .v{display:flex;flex-direction:column;gap:8px}
.versus .vl{font-size:22px;font-weight:700;color:var(--ink-3)}
.versus .vt{font-size:28px;line-height:1.45;color:var(--ink);white-space:pre-line;font-weight:500}
.versus .v.key .vl{color:var(--c-blue)}
.versus .neq{font-size:60px;font-weight:300;color:var(--c-coral);text-align:center;line-height:1}
.versus .neq small{display:block;font-size:17px;color:var(--ink-3);margin-top:6px;white-space:pre-line;font-weight:600}
.loop{margin-top:34px;position:relative}
.loop svg{width:100%;height:110px;display:block;overflow:visible}
.loop-label{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:var(--bg);padding:6px 20px;font-size:24px;font-weight:600;color:var(--c-coral);white-space:nowrap}

/* 3장 S-곡선 */
.split{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:64px;min-height:0;flex:1}
.chart-box{position:relative;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.chart-title{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:22px;font-weight:700;color:var(--ink)}
.chart-box svg{width:100%;flex:1;min-height:0;display:block;overflow:visible}
.axis{stroke:var(--ink-3);stroke-width:2;fill:none}
.axis-label{fill:var(--ink-2);font-size:20px;font-family:var(--font-body);font-weight:600}
.tick{fill:var(--ink-3);font-size:17px;font-family:var(--font-mono)}
.grid-line{stroke:var(--line);stroke-width:1}
.curve{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:0}
.slide.play .draw{animation:draw var(--dur,1.4s) cubic-bezier(.45,.1,.25,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.band{opacity:0;transition:opacity .35s}
.band.hl{opacity:.13}
.band-label{font-size:19px;font-weight:700;font-family:var(--font-body);transition:opacity .3s}
.seg-hl{fill:none;stroke-width:12;stroke-linecap:round;opacity:0;transition:opacity .35s}
.seg-hl.hl{opacity:1}
.limit{stroke:var(--c-coral);stroke-width:2.5;stroke-dasharray:9 8}
.limit-label{fill:var(--c-coral);font-size:19px;font-weight:700}
.phase-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;justify-content:center}
.phase-list li{display:grid;grid-template-columns:52px 1fr;gap:4px 18px;padding:20px 24px;border-radius:18px;background:color-mix(in srgb,var(--c) 8%,white)}
.phase-list .pn{font-family:var(--font-mono);font-size:18px;font-weight:600;color:#fff;background:var(--c);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;grid-row:span 2}
.phase-list .pt{font-size:31px;font-weight:800;color:var(--c);letter-spacing:-.02em}
.phase-list .pd{font-size:23px;line-height:1.5;color:var(--ink-2);white-space:pre-line}

/* 5장 타임라인 */
.pt-dot{stroke:#fff;stroke-width:4;opacity:0}
.pt-val{font-size:22px;font-family:var(--font-mono);font-weight:600;text-anchor:middle;opacity:0}
.pt-bg{opacity:0}
.slide.play .pt-dot,.slide.play .pt-val,.slide.play .pt-bg{animation:pop .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
.slide:not(.play) .pt-dot,.slide:not(.play) .pt-val,.slide:not(.play) .pt-bg,.slide.show-all .pt-dot,.slide.show-all .pt-val,.slide.show-all .pt-bg{opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.big-num{display:flex;flex-direction:column;gap:6px;padding:26px 30px;border-radius:20px;background:var(--surface)}
.big-num .bn-label{font-size:20px;color:var(--ink-2);font-weight:600}
.big-num .bn{font-family:var(--font-mono);font-size:96px;line-height:1.05;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums;white-space:nowrap}
.big-num .bn .from{color:var(--c-teal)}
.big-num .bn small{font-size:36px;color:var(--ink-3);margin-left:10px;letter-spacing:0;font-weight:500}
.big-num .bn .arrow{color:var(--ink-3);font-weight:400;margin:0 14px}
.big-num .bn .to{background:linear-gradient(90deg,var(--c-blue),var(--c-violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.legend{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--ink-2);font-weight:500}
.legend i{width:30px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c-teal),var(--c-blue),var(--c-violet));display:inline-block}
.mini-photo{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.mini-photo .media{height:96px;border-radius:12px}
.mini-photo figcaption{flex-direction:column;gap:2px;font-size:16px}
.mini-photo figcaption .credit{text-align:left}

/* 6장 사례 */
.case{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:60px;flex:1;min-height:0}
.case-card{display:flex;flex-direction:column;gap:18px;padding:0 0 30px;border-radius:20px;background:var(--surface);height:100%;box-sizing:border-box;overflow:hidden;position:relative}
.case-card .photo{position:relative;height:210px;flex:none}
.case-card .photo .fig{position:absolute;inset:0;gap:0}
.case-card .photo .media{border-radius:0}
.case-card .photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 18px 10px;background:linear-gradient(transparent,rgba(10,16,30,.62));color:#fff;font-size:15px}
.case-card .photo figcaption .credit{color:rgba(255,255,255,.85)}
.case-card .inner{display:flex;flex-direction:column;gap:16px;padding:0 36px;flex:1}
.case-card .cc-org{font-size:20px;color:var(--ink-3);font-weight:600}
.case-card .cc-title{font-size:38px;font-weight:800;letter-spacing:-.03em}
.case-card .cc-date{display:flex;gap:14px;align-items:center;font-size:21px;color:var(--ink-2)}
.case-card .cc-date b{font-family:var(--font-mono);font-weight:600;font-size:26px;color:#fff;background:var(--c-teal);padding:4px 12px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:21px;font-weight:600;padding:7px 16px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 11%,white)}
.cc-cap{font-size:16px;color:var(--ink-3);margin-top:auto}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.points li{display:grid;grid-template-columns:22px 1fr;gap:16px;font-size:27px;line-height:1.5;color:var(--ink)}
.points li::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c-teal);margin-top:15px}
.points li span{white-space:pre-line}
.caveat{margin-top:auto;display:flex;gap:16px;align-items:flex-start;padding:22px 26px;border-radius:16px;font-size:23px;line-height:1.5;color:#9A2A1F;background:#FFF2EE}
.caveat svg{width:28px;height:28px;flex:none;color:var(--c-coral);margin-top:2px}
.case-fig{height:100%}

/* 7장 요인 */
.factors{display:grid;grid-template-columns:minmax(0,1fr) 470px minmax(0,1fr);grid-template-rows:1fr 1fr;gap:20px 34px;flex:1;min-height:0}
.ring{grid-column:2;grid-row:1/span 2;align-self:center}
.ring svg{width:100%;height:auto;display:block;overflow:visible}
.ring-node{stroke:#fff;stroke-width:4;transition:r .3s}
.ring-text{fill:var(--ink-2);font-size:20px;font-family:var(--font-body);font-weight:700;text-anchor:middle;transition:fill .3s}
.ring-text.hl{fill:var(--ink)}
.ring-arc{fill:none;stroke:var(--line-2);stroke-width:2.5}
.factor{display:flex;flex-direction:column;gap:8px;justify-content:center;padding:20px 26px;border-radius:18px;background:color-mix(in srgb,var(--c) 8%,white);min-width:0}
.factor .fh{display:flex;gap:12px;align-items:center}
.factor .fn{font-size:19px;font-weight:800;color:var(--c)}
.factor .ic{width:42px;height:42px;color:var(--c);padding:8px;border-radius:12px;background:var(--bg);box-sizing:border-box}
.factor .ft{font-size:27px;font-weight:700;line-height:1.36;letter-spacing:-.02em;white-space:pre-line}
.factor .fl{font-size:19px;color:var(--ink-2);white-space:pre-line;font-weight:500}
.analysis{display:inline-flex;align-self:flex-start}

/* 8장 비교 */
.scale{position:relative;margin:34px 0 0;height:230px}
.scale-line{position:absolute;left:0;right:0;top:154px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--c-sky),var(--c-blue) 40%,var(--c-violet) 70%,var(--c-teal))}
.scale-end{position:absolute;top:182px;font-size:22px;font-weight:600;color:var(--ink-3)}
.scale-end.r{right:0}
.marker{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.marker .mk-box{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 26px;border-radius:16px;background:var(--c);color:#fff}
.marker .mk-l{font-size:42px;font-weight:800;letter-spacing:-.02em}
.marker .mk-t{font-size:20px;white-space:nowrap;font-weight:500;opacity:.92}
.marker .mk-pin{width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--c);box-sizing:border-box;margin-top:4px}
.scale-cap{font-size:19px;color:var(--ink-3);margin-top:10px}
.scale-title{font-size:22px;font-weight:700;color:var(--ink-2)}
.limits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:auto;padding:0}
.limits li{list-style:none;font-size:23px;line-height:1.5;color:var(--ink);white-space:pre-line;padding:20px 24px;border-radius:16px;background:var(--surface)}
.limits li b{display:block;font-family:var(--font-mono);font-weight:600;font-size:17px;color:var(--c-coral);margin-bottom:8px}
.limits{margin-bottom:0}

/* 9장 결론 */
.concl{display:flex;flex-direction:column;flex:1;min-height:0}
.concl .statement{font-family:var(--font-display);font-size:64px;line-height:1.24;font-weight:800;letter-spacing:-.04em;max-width:1380px;text-wrap:balance;white-space:pre-line;margin:28px 0 0}
.takeaways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:48px;padding:0}
.takeaways li{list-style:none;display:flex;flex-direction:column;gap:10px;padding:26px 30px;border-radius:20px;background:color-mix(in srgb,var(--c) 9%,white);font-size:30px;font-weight:600;line-height:1.42;white-space:pre-line}
.takeaways li b{font-family:var(--font-mono);font-weight:600;font-size:19px;color:var(--c)}
.refs{margin-top:auto;display:flex;flex-direction:column;gap:3px;font-size:15px;line-height:1.5;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}
.refs .rh{font-weight:700;font-size:14px;color:var(--ink-2);margin-bottom:2px}
.refs a{color:var(--ink-2);word-break:break-all}

/* 일반 텍스트 슬라이드 */
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px;max-width:1300px}
.bullets li{display:grid;grid-template-columns:24px 1fr;gap:16px;font-size:30px;line-height:1.5;color:var(--ink)}
.bullets li::before{content:"";width:12px;height:12px;background:var(--c-blue);border-radius:4px;margin-top:16px}
.bullets li span{white-space:pre-line}

/* ---------- 반응형 ---------- */
@media (max-width:900px){
  .drawer{position:absolute;left:0;right:0;bottom:0;width:auto;height:60%;border-left:0;border-top:1px solid var(--line);z-index:12;box-shadow:0 -20px 40px rgba(15,26,44,.18)}
  .btn .lbl{display:none}
  .controls{grid-template-columns:auto 1fr auto;gap:10px}
  .controls .progress{grid-column:1/-1;grid-row:1}
  .timer{display:none}
}
@media (max-width:520px){
  .brand span{display:none}
  .mode-chip{display:none}
  .viewport{padding:10px}
}

@media (prefers-reduced-motion:reduce){
  .slide,.slide.is-active,.frag,.hl-item,.band,.seg-hl,.progress .seg i{transition:none!important}
  .slide.play .draw,.slide.play .pt-dot,.slide.play .pt-val,.slide.play .pt-bg{animation:none!important;opacity:1}
}

/* ---------- 인쇄: 슬라이드 한 장씩 ---------- */
@page{size:1600px 900px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,.controls,.drawer,.script-bar,.toast,.edit-only{display:none!important}
  #app{display:block}
  .viewport{display:block;padding:0;overflow:visible}
  .stage-wrap{width:auto!important;height:auto!important}
  .stage{position:static;transform:none!important;width:1600px;height:auto;box-shadow:none!important;border-radius:0;overflow:visible;background:none}
  .slide{position:relative;inset:auto;width:1600px;height:900px;opacity:1!important;visibility:visible!important;transform:none!important;page-break-after:always;break-after:page;transition:none}
  .slide .frag{opacity:1!important;transform:none!important}
  .slide .pt-dot,.slide .pt-val,.slide .pt-bg{opacity:1!important;animation:none!important}
  .slide .draw{animation:none!important;stroke-dashoffset:0!important}
  .slide.has-hl .hl-item:not(.hl){opacity:1}
  body.editing .slide [data-k]{outline:none}
}

/* ---------- v3: 모션 ---------- */
.rise{opacity:1}
.slide.play .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.slide.play .s-head .eyebrow{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.slide.play .s-head .lead{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:.06s}
.slide.play .fig .media img{animation:kenburns 12s ease-out both}
@keyframes kenburns{from{transform:scale(1.1)}to{transform:scale(1)}}
.slide.play .frag.on .draw{animation-name:draw2}
@keyframes draw2{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.flowing{animation:dashflow 1.6s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-36}}
.traveler{fill:#fff;stroke:var(--c-blue);stroke-width:5;offset-distance:0%;opacity:0}
.slide.play .traveler{animation:travel 2.6s cubic-bezier(.45,.1,.25,1) 1.2s both}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}100%{offset-distance:100%;opacity:1}}
.slide.has-hl .traveler{opacity:0!important;animation:none}
.pulse{fill:none;stroke:var(--c-violet);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.area-fill{opacity:0}
.slide.play .area-fill,.slide:not(.play) .area-fill{animation:fadein 1s ease .8s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.cover-q{background-size:200% 100%}
.slide.play .cover-q{animation:rise .8s cubic-bezier(.2,.7,.2,1) both,shimmer 6s ease-in-out 1s infinite alternate}
@keyframes shimmer{from{background-position:0% 0}to{background-position:100% 0}}
@media (prefers-reduced-motion:reduce){
  .slide.play .rise,.slide.play .s-head .eyebrow,.slide.play .s-head .lead,.slide.play .fig .media img,.flowing,.pulse,.slide.play .cover-q,.slide.play .frag.on .draw{animation:none!important}
  .slide.play .traveler{animation:none;opacity:0}
}
@media print{
  .rise,.slide .s-head .eyebrow,.slide .s-head .lead{animation:none!important;opacity:1!important;transform:none!important}
  .traveler,.pulse{display:none}
}

/* ---------- v3: 공통 보강 ---------- */
.lead-sm{font-size:48px}
.lec-thumb{position:relative;margin:0;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);min-width:0}
.lec-thumb img{width:100%;height:auto;display:block;border-radius:6px}
.lec-thumb figcaption{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--ink-3)}
.lec-thumb figcaption b{font-weight:700;color:var(--ink-2)}
.side-row{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;margin-top:auto}
.tip{margin:0;font-size:20px;line-height:1.5;color:var(--ink-2);font-weight:500;padding-left:16px;border-left:3px solid var(--c-coral)}
.scurve-side{display:flex;flex-direction:column;gap:16px}
.phase-list{gap:12px}
.phase-list li{padding:14px 20px}
.phase-list .pt{font-size:27px}
.phase-list .pd{font-size:21px}
.caveat.soft{background:var(--surface);color:var(--ink)}
.caveat.soft svg{color:var(--c-violet)}

/* 2장 질문 */
.quote{margin:0;padding:26px 34px;border-radius:20px;background:var(--surface);position:relative}
.quote::before{content:"“";position:absolute;left:18px;top:-18px;font-size:120px;line-height:1;font-weight:800;color:var(--c-blue);opacity:.25}
.quote p{margin:0;font-size:26px;line-height:1.6;color:var(--ink);font-weight:500;white-space:pre-line}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:17px;color:var(--ink-3);font-weight:600}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:28px}
.qa-card{display:flex;flex-direction:column;gap:8px;padding:26px 28px;border-radius:20px;background:color-mix(in srgb,var(--c) 9%,white);border:2px solid transparent}
.qa-card.hl{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,white)}
.qa-n{font-family:var(--font-mono);font-weight:600;font-size:18px;color:#fff;background:var(--c);align-self:flex-start;padding:3px 12px;border-radius:999px}
.qa-q{font-size:24px;color:var(--ink-2);font-weight:600}
.qa-a{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--c);line-height:1.15}
.qa-note{font-size:19px;color:var(--ink-2)}

/* 4장 흐름도 압축형 */
.flow.compact .node{padding:22px 24px 22px;gap:8px}
.flow.compact .node .nl{font-size:30px}
.flow.compact .node .nd{font-size:20px}
.flow.compact .node .ic{width:46px;height:46px}
.loop-line{position:relative;margin:6px 0 0;height:54px}
.loop-line svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.loop-line .loop-label{bottom:-6px;font-size:20px}
.cycle-bottom{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:26px;margin-top:20px;flex:1;min-height:0;align-items:stretch}
.findings{padding:22px 28px;border-radius:18px;background:color-mix(in srgb,var(--c-violet) 8%,white);display:flex;flex-direction:column;gap:10px}
.findings b{font-size:20px;color:var(--c-violet);font-weight:800}
.findings ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.findings li{font-size:22px;line-height:1.5;color:var(--ink);padding-left:22px;position:relative}
.findings li::before{content:"";position:absolute;left:0;top:13px;width:9px;height:9px;border-radius:3px;background:var(--c-violet)}
.cycle-bottom .lec-thumb{justify-content:center}

/* 5장 두 S-곡선 */
.curve-label{font-size:22px;font-weight:800;font-family:var(--font-body)}
.note-label{font-size:19px;fill:var(--ink-2);font-weight:600;font-family:var(--font-body)}
.ex-title{font-size:20px;font-weight:700;color:var(--ink-3)}
.examples{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.examples li{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:6px 16px;padding:18px 24px;border-radius:16px;background:var(--surface)}
.ex-from{font-size:27px;font-weight:600;color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--c-coral);text-decoration-thickness:2px}
.ex-arrow{font-size:28px;color:var(--c-violet);font-weight:700}
.ex-to{font-size:30px;font-weight:800;color:var(--c-violet)}
.examples small{grid-column:1/-1;font-size:18px;color:var(--ink-2)}

/* 8장 기술 방식 전환 */
.shift{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;flex:1;min-height:0}
.stairs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end;height:100%}
.stair{display:flex;flex-direction:column;gap:8px;padding:22px 22px 18px;border-radius:20px;background:color-mix(in srgb,var(--c) 9%,white);margin-bottom:calc(var(--k) * 70px);position:relative;border-top:5px solid var(--c)}
.st-year{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--c)}
.st-name{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.st-text{font-size:19px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.st-curve{width:100%;height:70px;overflow:visible;margin-top:4px}
.shift-side{display:flex;flex-direction:column;gap:18px;min-height:0}
.shift-photo{flex:1}
.shift-photo .media{background:#fff;border:1px solid var(--line)}
.shift-photo .media img{object-fit:contain}

/* 9장 에페 */
.efe{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:48px;flex:1;min-height:0}
.efe-l{display:flex;flex-direction:column;gap:16px;min-height:0}
.efe-photo{flex:1}
.efe-photo .media{background:#fff;border:1px solid var(--line)}
.efe-photo .media img{object-fit:contain}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.facts div{padding:12px 14px;border-radius:12px;background:var(--surface)}
.facts dt{font-size:15px;font-weight:700;color:var(--ink-3)}
.facts dd{margin:4px 0 0;font-size:18px;font-weight:600;line-height:1.4;color:var(--ink)}
.efe-r{display:flex;flex-direction:column;gap:16px;min-width:0}
.path{list-style:none;margin:0;padding:0 0 0 30px;display:flex;flex-direction:column;gap:14px;position:relative}
.path::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:3px;border-radius:2px;background:linear-gradient(var(--c-orange),var(--c-violet),var(--c-teal))}
.path li{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px 20px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,white)}
.path li::before{content:"";position:absolute;left:-29px;top:20px;width:17px;height:17px;border-radius:50%;background:#fff;border:4px solid var(--c);box-sizing:border-box}
.p-when{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--c)}
.p-what{font-size:23px;font-weight:600;line-height:1.45;color:var(--ink)}
.pipe-note{margin:0;font-size:18px;color:var(--ink-2);line-height:1.5}
.efe-r .caveat{margin-top:auto;padding:16px 20px;font-size:20px}
.efe-r .tag{font-size:18px}

/* 10장 요인 보강 */
.factors .factor{padding:16px 22px}
.factors .factor .ft{font-size:25px}
.factors .factor .fl{font-size:18px}
.strip{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 22px;border-radius:14px;background:color-mix(in srgb,var(--c-blue) 8%,white);font-size:21px;font-weight:600;color:var(--ink)}
.strip svg{width:30px;height:30px;color:var(--c-blue);flex:none}

/* 11·12장 */
.scale{height:210px;margin-top:22px}
.scale-line{top:140px}
.scale-end{top:166px}
.limits li{padding:16px 20px;font-size:21px}
.takeaways{grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:22px;margin-top:40px}
.takeaways li{font-size:26px;padding:22px 26px}

/* v3.1 레이아웃 보정 */

/* v4 */
.study{display:flex;flex-direction:column;gap:14px;padding:24px 28px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}

/* v5: 핵심 문구 밑줄·포인트 */
.mark-u{color:var(--c-coral);background-image:linear-gradient(color-mix(in srgb,var(--c-coral) 26%,transparent),color-mix(in srgb,var(--c-coral) 26%,transparent));background-repeat:no-repeat;background-position:0 92%;background-size:100% .34em;padding:0 .06em;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.slide.play .mark-u{animation:markDraw 1s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes markDraw{from{background-size:0 .34em}to{background-size:100% .34em}}
@media (prefers-reduced-motion: reduce){.slide.play .mark-u{animation:none}}
.tl-ev-t{font-size:19px;font-weight:700;letter-spacing:-.01em}
.slide.play .tl-ev{animation:fadeIn .6s ease both;animation-delay:var(--d)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.shift.n5{grid-template-columns:minmax(0,2.5fr) minmax(0,1fr);gap:28px}

/* v6: 11장 같은 기간 비교, 13장 참고문헌 */
.win{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:22px;align-items:stretch;flex:1;min-height:0}
.win-col{display:flex;flex-direction:column;gap:14px;padding:24px 28px;border-radius:22px;background:color-mix(in srgb,var(--c) 7%,white);border-top:6px solid var(--c)}

.win-name{font-size:24px;font-weight:700;color:var(--ink-2)}
.win-verdict{font-size:30px;font-weight:800;color:var(--c);letter-spacing:-.02em;white-space:nowrap}
.win-rows{list-style:none;margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:10px;position:relative}
.win-rows::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:color-mix(in srgb,var(--c) 35%,transparent)}
.win-rows li{display:flex;gap:16px;align-items:baseline;font-size:22px;color:var(--ink);position:relative}
.win-rows li::before{content:"";position:absolute;left:-22px;top:.45em;width:15px;height:15px;border-radius:50%;background:#fff;border:4px solid var(--c);box-sizing:border-box}
.win-when{font-family:var(--font-mono);font-weight:600;color:var(--c);min-width:104px;font-size:20px}
.win-why{margin:auto 0 0;padding:14px 18px;border-radius:14px;background:#fff;font-size:21px;line-height:1.45;font-weight:600;color:var(--ink);white-space:pre-line}
.win-span{align-self:center;writing-mode:horizontal-tb;padding:12px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:18px;font-weight:700;white-space:nowrap}
.win-limit{margin:16px 0 0;font-size:18px;color:var(--ink-3)}

.reflist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 40px;margin-top:28px;align-content:start}
.reflist section{padding:18px 22px;border-radius:18px;background:color-mix(in srgb,var(--c) 6%,white);border-left:5px solid var(--c)}
.reflist h3{margin:0 0 10px;font-size:20px;font-weight:800;color:var(--c)}
.reflist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reflist li{font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.reflist a{color:var(--ink-3);white-space:nowrap}
.concl .takeaways{flex:1;max-height:330px;align-items:stretch;margin-top:44px}
.concl .takeaways li{padding:30px 32px;gap:16px}
.tk{display:flex;flex-direction:column;gap:14px}
.tk-h{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--c)}
.tk-b{display:block;font-size:24px;font-weight:600;line-height:1.5;color:var(--ink);white-space:pre-line}
.concl-close{margin:auto 0 0;align-self:flex-end;font-size:22px;font-weight:700;color:var(--ink-3)}
.win-stat{display:flex;align-items:baseline;gap:16px;padding:4px 0 6px;border-bottom:1px dashed color-mix(in srgb,var(--c) 35%,transparent)}
.ws-n{font-family:var(--font-display);font-size:60px;font-weight:800;letter-spacing:-.04em;color:var(--c);line-height:1}
.ws-l{font-size:19px;font-weight:600;color:var(--ink-2)}
.win-when{min-width:150px;font-size:19px}
.win-col{gap:12px;padding:20px 26px}
.win-rows li{font-size:21px}

/* v7 */
.st-tag{align-self:flex-start;font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,white);color:var(--c)}

.win-when{min-width:140px}
.win-verdict{font-size:24px}
.win-why{font-size:22px}

/* v8: slide 2 questions first, short problem line below */
.quote.compact{margin-top:18px;padding:12px 22px;border-radius:14px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}

.era rect{fill:var(--c-orange);opacity:.06}

.key-shift .ks-label{font-size:20px;font-weight:700;color:var(--c-violet)}
.key-shift .ks-big{font-size:64px;line-height:1.1;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.key-shift .ks-big b{font-weight:800;color:var(--ink)}
.key-shift .ks-big .to{color:var(--c-violet)}
.key-shift .ks-big .arrow{color:var(--ink-3);font-weight:400;margin:0 16px}
.key-shift .ks-text{font-size:18px;line-height:1.5;color:var(--ink-2);white-space:pre-line}

/* ================= network-effects deck ================= */
.s-foot .src:empty{display:none}
.s-foot:has(.src:empty){justify-content:flex-end}
.lec{display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill{display:inline-flex;align-self:flex-start;font-size:18px;font-weight:700;color:#fff;background:var(--c-teal);padding:6px 16px;border-radius:999px}

/* 표지 */
.cover-q{font-size:60px}

/* 목차 */
.agenda{list-style:none;margin:auto 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.ag{position:relative;display:flex;flex-direction:column;gap:14px;padding:40px 30px 44px;border-radius:22px;background:color-mix(in srgb,var(--c) 7%,white);border:1px solid color-mix(in srgb,var(--c) 22%,white);overflow:hidden;min-height:300px}
.ag-n{font-family:var(--font-mono);font-size:64px;font-weight:600;color:var(--c);line-height:1}
.ag-t{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:auto;line-height:1.25;white-space:pre-line}
.ag-d{font-size:21px;color:var(--ink-2)}
.ag-bar{position:absolute;left:0;bottom:0;height:8px;width:100%;background:var(--c);transform-origin:left}
.slide.play .ag-bar{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 140ms + 300ms)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}

/* 순환도 */
.loop{width:100%;height:100%;display:block;overflow:visible}
.lp-c{fill:var(--ink);transition:fill .3s}
.lp-node{color:#fff}
.lp-node .lp-c{fill:var(--c)}
.lp-ic{stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lp-t{font-size:27px;font-weight:700;fill:var(--ink);text-anchor:middle;font-family:var(--font-body)}
.lp-arc{fill:none;stroke:var(--ink-3);stroke-width:3;stroke-dasharray:8 8;animation:dashflow 1.6s linear infinite}
.lp-hub{fill:color-mix(in srgb,var(--c-teal) 8%,white);stroke:color-mix(in srgb,var(--c-teal) 30%,white);stroke-width:2}
.lp-center{font-size:34px;font-weight:800;fill:var(--teal);text-anchor:middle;font-family:var(--font-body)}
.lp-center.sm{font-size:27px}
.slide.play .loop.spin .lp-node{animation:pop .6s cubic-bezier(.2,.7,.2,1.3) both;animation-delay:calc(var(--k) * 260ms + 400ms);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.loop .frag{transform-box:fill-box;transform-origin:center}
.slide:not(.show-all) .loop .frag:not(.on){opacity:0;transform:scale(.7)}

/* 3장 개념 */
.concept{display:grid!important;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:stretch}
.cc-l{display:flex;flex-direction:column;gap:26px;min-width:0}
.qbox{display:flex;gap:18px;align-items:center;background:var(--surface);border-radius:16px;padding:20px 24px}
.qbox p{margin:0;font-size:23px;font-weight:600;line-height:1.45}
.qmark{flex:none;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.defn{display:flex;flex-direction:column;gap:6px}
.kicker{font-size:19px;font-weight:700;color:var(--teal)}
.dn{margin:0;font-size:46px;font-weight:800;letter-spacing:-.03em}
.de{font-size:19px;color:var(--ink-3)}
.dfn-d{margin:10px 0 0;font-size:25px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.contrast{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
.ct{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:14px;border:1px solid var(--line);color:var(--ink-3)}
.ct .ic{width:34px;height:34px;flex:none}
.ct b{display:block;font-size:18px;color:var(--ink-2);line-height:1.35}
.ct span{font-size:20px;font-weight:700}
.ct.on{border-color:color-mix(in srgb,var(--c-teal) 40%,white);background:var(--teal-soft);color:var(--teal)}
.ct.on b{color:var(--teal)}
.cc-r{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}

/* 4장 이유 카드 */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;height:100%}
.rcard{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:color-mix(in srgb,var(--c) 6%,white);border:1px solid color-mix(in srgb,var(--c) 20%,white);min-height:0}

.rc-top{display:flex;align-items:center;gap:12px}
.rc-ic{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.rc-ic .ic{width:26px;height:26px}
.rc-k{font-size:19px;font-weight:700;color:var(--c)}
.rc-n{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
.rc-d{margin:0;font-size:21px;line-height:1.45;color:var(--ink-2);white-space:pre-line}
.rc-stats{display:flex;flex-direction:column;gap:2px;font-size:19px;color:var(--ink-2)}

.slide.has-hl .rcard.hl{box-shadow:0 0 0 3px var(--c),0 18px 40px rgba(15,26,44,.12);transform:translateY(-4px)}
.rcard{transition:opacity .3s,box-shadow .3s,transform .3s}

/* 5장 공급 쪽 */
.supply{display:grid!important;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px}
.srows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;min-width:0}
.srow{display:flex;gap:20px;align-items:center;padding:16px 20px 16px 16px;border-radius:18px;border:1px solid var(--line);background:#fff;flex:1;min-height:0;transition:opacity .3s,box-shadow .3s,border-color .3s}
.sr-ph,.sr-ic{flex:none;width:130px;height:110px;border-radius:14px}
.sr-ic{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c)}

/* 6장 배달의민족 */
.platform{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.pf-l{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}

.loop.teal .lp-arc{stroke:var(--c-teal)}

.pf-r{display:flex;flex-direction:column;gap:22px;min-width:0}

.keybox b{font-size:25px}

/* 7장 USB-C */
.usbc{gap:18px}
.ub-cols{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);gap:0;flex:1;min-height:0}
.ub{display:flex;flex-direction:column;gap:12px;border-radius:22px;padding:22px 26px;min-height:0}
.ub.before{background:var(--surface)}
.ub.after{background:var(--accent-soft)}
.ub header span{font-size:22px;font-weight:800}
.ub.after header span{color:var(--accent)}
.ub-ph{height:150px;border-radius:14px;flex:none}
.ub-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ub-rows li{display:flex;align-items:center;gap:12px;font-size:20px}
.ub-rows .ic{width:26px;height:26px;color:var(--ink-3)}
.ub-rows b{font-weight:600;min-width:130px}
.port{font-size:17px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;background:#8792A6}
.port.p1{background:#5F6B80}.port.p2{background:#3D475A}
.ub-res{margin:auto 0 0;font-size:20px;font-weight:700;color:var(--ink-2)}
.ub.after .ub-res{color:var(--accent)}
.ub-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--accent);text-align:center}
.ub-mid .ic{width:56px;height:56px}
.ub-mid span{font-size:17px;font-weight:700;line-height:1.3}
.hub{position:relative;display:grid;grid-template-columns:auto 80px 1fr;align-items:center}
.hub-c{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--accent);color:#fff;border-radius:16px;padding:12px 16px}
.hub-c .ic{width:30px;height:30px}
.hub-c b{font-size:17px;white-space:nowrap}
.hub-lines{width:80px;height:100%}
.hub-lines path{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:5 5;animation:dashflow 1.6s linear infinite}
.hub-d{list-style:none;margin:0;padding:0;display:grid;grid-template-rows:repeat(4,1fr);gap:4px}
.hub-d li{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;background:#fff;border-radius:10px;padding:4px 12px}
.hub-d .ic{width:22px;height:22px;color:var(--accent)}
.ub-law{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 20px;flex-wrap:wrap}
.ub-law .pill{background:var(--c-violet)}
.ul-r{font-size:21px}
.ul-t{list-style:none;margin:0 0 0 auto;padding:0;display:flex;gap:10px}
.ul-t li{display:flex;align-items:center;gap:10px;font-size:18px;background:color-mix(in srgb,var(--c-violet) 8%,white);border-radius:10px;padding:8px 14px;color:var(--ink-2)}
.ul-t .lw{font-family:var(--font-mono);font-weight:600;color:var(--c-violet)}

/* 8장 표 */
.sumt{width:100%;border-collapse:separate;border-spacing:0;font-size:24px}
.sumt th,.sumt td{padding:20px 26px;text-align:left;border-bottom:1px solid var(--line);line-height:1.4}
.sumt thead th{font-size:25px;font-weight:800;color:var(--c);border-bottom:3px solid var(--c)}
.sumt tbody th{font-size:20px;font-weight:700;color:var(--ink-3);width:220px}
.sumt tr.last td{font-weight:800;font-family:var(--font-display);background:var(--surface)}
.sumt tr.last td:first-of-type{color:var(--c-teal)}
.sumt tr.last td:last-of-type{color:var(--c-blue)}
.common{display:flex;align-items:center;gap:18px;margin-top:auto;background:var(--teal-soft);border-radius:18px;padding:22px 28px;color:var(--teal)}
.common .ic{width:30px;height:30px}
.common b{font-size:22px}
.common span{font-size:24px;font-weight:600;color:var(--ink)}

/* 9장 결론 */
.wrap{gap:20px}
.wr-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;flex:1;min-height:0}
.wr-l{display:flex;flex-direction:column;gap:16px;justify-content:center}
.side{display:flex;flex-direction:column;gap:8px;padding:22px 28px;border-radius:18px;background:color-mix(in srgb,var(--c) 9%,white)}
.sd-l{font-size:18px;font-weight:700;color:var(--c)}
.sd-h{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sd-s{font-size:18px;color:var(--ink-3)}
.wr-r{min-height:0;display:flex;align-items:center;justify-content:center}
.wr-r .loop{max-height:330px}
.dd{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:26px;row-gap:10px;align-items:center;padding:20px 28px;border-radius:18px;background:linear-gradient(100deg,color-mix(in srgb,var(--c-violet) 10%,white),color-mix(in srgb,var(--c-teal) 10%,white));border:1px solid color-mix(in srgb,var(--c-violet) 25%,white)}
.dd-l{grid-row:1 / span 2;font-size:19px;font-weight:800;color:var(--c-violet);writing-mode:horizontal-tb;background:#fff;border-radius:12px;padding:10px 14px}
.dd-chain{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:0}
.dd-chain li{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700;color:var(--ink-2);background:#fff;border-radius:999px;padding:8px 18px}
.dd-chain li:not(:last-child)::after{content:"";display:none}
.dd-chain li + li{margin-left:44px;position:relative}
.dd-chain li + li::before{content:"→";position:absolute;left:-34px;color:var(--ink-3);font-weight:700}
.dd-chain li.goal{background:var(--c-violet);color:#fff;font-size:24px;font-weight:800}
.dd-chain li.goal .ic{width:24px;height:24px}
.slide.play .dd.on .dd-chain li,.dd.on .dd-chain li{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * 220ms + 150ms)}
.dd-t{margin:0;font-size:21px;line-height:1.45;color:var(--ink);white-space:pre-line;font-weight:600}

/* 10장 마무리 */
.closing{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.cl-big{margin:0;font-size:120px;font-weight:800;letter-spacing:-.05em;background:linear-gradient(100deg,var(--ink) 30%,var(--c-teal) 70%,var(--c-blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.cl-sub{margin:16px 0 0;font-size:44px;font-weight:700;color:var(--ink-3);font-family:var(--font-mono)}
.cl-loop{display:flex;gap:16px;margin-top:40px}
.cl-loop i{width:18px;height:18px;border-radius:50%;background:var(--c-teal);animation:blink 1.5s ease-in-out infinite}
.cl-loop i:nth-child(2){background:var(--c-blue);animation-delay:.25s}
.cl-loop i:nth-child(3){background:var(--c-violet);animation-delay:.5s}
@keyframes blink{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:none}}
.cl-cred{position:absolute;left:0;right:0;bottom:0;margin:0;font-size:14px;line-height:1.5;color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){.lp-arc,.hub-lines path,.cl-loop i{animation:none}}

.slide.play .hl-item.rise{animation-fill-mode:backwards}
.ag-ic{position:absolute;right:26px;top:34px;color:var(--c);opacity:.18}
.ag-ic .ic{width:110px;height:110px}
.ub-ph{height:175px}
.ub{padding:20px 24px;gap:14px}
.ul-t li{font-family:var(--font-body)}
.ul-t .lw{font-family:var(--font-mono)}
.ub-law{flex-wrap:nowrap}
.sumt{font-size:26px}
.sumt th,.sumt td{padding:24px 26px}

/* ================= v2: 차분하고 고급스러운 톤 ================= */
:root{--ink:#0B1626;--ink-2:#465469;--ink-3:#8A94A6;--surface:#F6F7F9;--line:#E6E9EF;--line-2:#CDD3DD;
  --c-blue:#2453D6;--c-teal:#0E9F8E;--teal:#0B8A7C;--teal-soft:#E8F6F3;--c-violet:#4F5BD5;--c-orange:#E07A2F;--c-coral:#E5484D;--c-sky:#2A8FD3;
  --accent:#2453D6;--accent-ink:#2453D6;--accent-soft:#EDF2FD;--navy:#0B1626;--mint:#7FE0D2;
  --card-sh:0 1px 2px rgba(11,22,38,.04),0 12px 32px rgba(11,22,38,.07)}
.slide::before{display:none}
.eyebrow .no{background:transparent;color:var(--teal);border:1.5px solid color-mix(in srgb,var(--teal) 45%,white);padding:3px 11px}
.eyebrow [data-k]{color:var(--ink-3);font-weight:600;letter-spacing:.01em}
.lead{color:var(--ink)}
.s-foot{border-top-color:var(--line)}

/* 표지 · 전면 사진 */
.slide.t-cover,.slide.t-closing{background:var(--navy);padding:0}
.cv{position:relative;height:100%;color:#fff}
.cv-hero{position:absolute;top:0;right:0;bottom:0;width:58%}
.cv-ph{position:absolute;inset:0;background:#16233A}
.cv-ph img{object-position:25% 50%}
.cv-shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 0%,rgba(11,22,38,.82) 12%,rgba(11,22,38,.25) 36%,rgba(11,22,38,0) 60%),linear-gradient(0deg,rgba(11,22,38,.55),rgba(11,22,38,0) 30%);pointer-events:none}
.cv-cap{position:absolute;right:40px;bottom:40px;display:flex;gap:10px;align-items:center;font-size:17px;color:rgba(255,255,255,.88);background:rgba(11,22,38,.5);backdrop-filter:blur(8px);padding:9px 16px;border-radius:999px}
.cv-cap b{color:var(--mint);font-weight:700}
.cv-l{position:relative;z-index:2;width:54%;height:100%;box-sizing:border-box;padding:70px 0 60px 96px;display:flex;flex-direction:column}
.cv-eye{display:flex;gap:14px;align-items:center;font-size:20px;color:rgba(255,255,255,.62);font-weight:600}
.cv-eye .no{font-family:var(--font-mono);font-size:17px;color:var(--mint);border:1.5px solid rgba(127,224,210,.5);border-radius:999px;padding:3px 11px}
.t-cover .cover-q{font-size:62px;line-height:1.2;margin:34px 0 0;background:linear-gradient(100deg,#fff 50%,var(--mint) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%}
body.editing .t-cover .cover-q{color:#fff;background:none}
.cv-meta{margin-top:30px;display:flex;flex-direction:column;gap:8px;padding-left:20px;border-left:3px solid var(--mint)}
.t-cover .cover-title{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.02em}
.t-cover .cover-sub{font-size:21px;color:rgba(255,255,255,.62)}
.cv-tiles{margin-top:auto;display:flex;gap:16px}
.cv-tile{display:flex;flex-direction:column;gap:10px;width:220px}
.cv-tph{height:124px;border-radius:14px;background:#16233A}
.cv-tile span{font-size:17px;font-weight:600;color:rgba(255,255,255,.78)}
.t-cover .cover-by{margin-top:26px;font-size:21px;font-weight:700;color:#fff}

/* 목차 */
.ag{background:#fff;border:1px solid var(--line);box-shadow:var(--card-sh)}
.ag-n{font-size:56px;color:var(--c)}
.ag-ic{opacity:.12}
.ag-bar{height:4px}

/* 카드 · 행 */
.rcard{background:#fff;border:1px solid var(--line);box-shadow:var(--card-sh)}
.rc-ph{height:196px;border-bottom:1px solid var(--line)}
.rc-ic{width:40px;height:40px;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c)}
.rc-ic .ic{width:22px;height:22px}
.rc-ex{background:color-mix(in srgb,var(--c) 7%,white);border-color:color-mix(in srgb,var(--c) 18%,white)}
.slide.has-hl .rcard.hl{box-shadow:0 0 0 2px var(--c),0 22px 48px rgba(11,22,38,.14)}
.srow{box-shadow:var(--card-sh);border-color:var(--line)}
.sr-ph,.sr-ic{width:150px;height:112px;border-radius:12px}
.sr-ph{border:1px solid var(--line)}

/* 5장 그래프: 2010년 → 2025년 */
.bchart{background:#fff;border:1px solid var(--line);box-shadow:var(--card-sh);border-radius:22px;padding:26px 32px 24px;--p:0;--h:100%}
.bc-head{display:flex;flex-direction:column;gap:4px}
.bc-t{font-size:24px;font-weight:800}
.bc-u{font-size:16px;color:var(--ink-3)}
.bt-read{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.bt-track{flex:1;display:flex;align-items:center;gap:14px;font-size:21px;color:var(--ink-2);max-width:330px}
.bt-track b{font-weight:700;white-space:nowrap}
.bt-track .bt-b{color:color-mix(in srgb,var(--c-coral) calc(var(--p) * 100%),var(--ink-3))}
.bt-line{position:relative;flex:1;height:4px;border-radius:2px;background:var(--line)}
.bt-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 100%);border-radius:2px;background:var(--c-coral)}
.bt-dot{position:absolute;top:50%;left:calc(var(--p) * 100%);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid color-mix(in srgb,var(--c-coral) calc(var(--p) * 100%),#8B96A9);transform:translate(-50%,-50%);box-sizing:border-box}
.bt-price{display:flex;align-items:baseline;gap:8px}
.bt-p{font-family:var(--font-mono);font-size:54px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);transition:color .4s}
.bchart.hl .bt-p,.bchart.done .bt-p{color:var(--c-coral)}
.bt-price small{font-size:17px;color:var(--ink-3);font-weight:600}
.bt-plot{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:34px 30px 0;margin-bottom:38px;border-bottom:2px solid var(--line-2)}
.bt-ref{position:absolute;left:0;right:0;top:34px;border-top:2px dashed var(--line-2);opacity:var(--p)}
.bt-col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0}
.bt-bar{display:block;width:118px;border-radius:8px 8px 0 0}
.bt-col.ghost{opacity:var(--p)}
.bt-col.ghost .bt-bar{height:100%;background:#D5DBE4}
.bt-col.live .bt-bar{height:var(--h);background:#8B96A9;transition:background .4s}
.bchart.hl .bt-col.live .bt-bar,.bchart.done .bt-col.live .bt-bar{background:var(--c-coral)}
.bt-v{font-family:var(--font-mono);font-size:23px;font-weight:700;margin-bottom:8px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bchart.hl .bt-col.live .bt-v,.bchart.done .bt-col.live .bt-v{color:var(--c-coral)}
.bt-x{position:absolute;bottom:-34px;font-size:18px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.bt-badge{position:absolute;left:50%;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;color:var(--ink-3);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.bt-badge b{font-size:56px;font-weight:800;color:var(--c-coral);letter-spacing:-.03em;font-family:var(--font-display);line-height:1}
.bchart.done .bt-badge{opacity:1;transform:none}

/* 6장 사진 */
.pf-r{gap:18px}
.pf-photo{position:relative;height:180px;border-radius:16px;overflow:hidden;box-shadow:var(--card-sh)}
.pf-ph{position:absolute;inset:0}
.pf-photo span{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 12px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(0deg,rgba(11,22,38,.7),rgba(11,22,38,0))}
.keybox{margin-top:0}

/* 7장 · 8장 · 9장 */
.ub.before{background:var(--surface)}
.ub.after{background:var(--accent-soft)}
.ub-ph{border:1px solid var(--line);background:#fafafa}
.ub-law{box-shadow:var(--card-sh)}
.side{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);box-shadow:var(--card-sh)}
.dd{background:linear-gradient(100deg,color-mix(in srgb,var(--c-violet) 7%,white),color-mix(in srgb,var(--c-teal) 8%,white));border-color:color-mix(in srgb,var(--c-violet) 18%,white)}

/* 10장 마무리 */
.t-closing .closing{padding:0 96px;box-sizing:border-box}
.cl-line{display:block;width:64px;height:4px;border-radius:2px;background:var(--mint);margin-bottom:34px}
.t-closing .cl-big{background:linear-gradient(100deg,#fff 45%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
body.editing .t-closing .cl-big{color:#fff;background:none}
.t-closing .cl-sub{color:var(--mint);opacity:.85}
.t-closing .cl-cred{left:96px;right:96px;bottom:40px;color:rgba(255,255,255,.45)}

/* ================= 신제품 개발 덱 ================= */
/* 3장 혁신의 터널 */
.funnel{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:stretch}
.fn-l{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 30px;box-shadow:var(--card-sh);min-width:0}
.tunnel{width:100%;height:auto;flex:1;min-height:0}
.tn-shape{fill:color-mix(in srgb,var(--c-blue) 7%,white);stroke:color-mix(in srgb,var(--c-blue) 30%,white);stroke-width:2}
.tn-dot{fill:#AEB7C6;transform-box:fill-box}
.tn-dot.win{fill:var(--c-teal)}
.slide.play .tn-dot{animation:tnIn 1.2s cubic-bezier(.4,0,.2,1) both;animation-delay:calc(var(--k) * 90ms + 500ms)}
.slide.play .tn-dot.win{animation:tnWin 2.2s cubic-bezier(.4,0,.2,1) both;animation-delay:1.4s}
@keyframes tnIn{0%{opacity:0;transform:translateX(-30px)}50%{opacity:1}100%{opacity:.3;transform:translateX(var(--tx)) translateY(var(--ty))}}
@keyframes tnWin{0%{transform:none}100%{transform:translateX(500px)}}
.slide:not(.play) .tn-dot{opacity:.3;transform:translateX(var(--tx)) translateY(var(--ty))}
.slide:not(.play) .tn-dot.win{opacity:1;transform:translateX(500px)}
.tn-labels{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;color:var(--ink-3);font-weight:600}
.tn-labels b{color:var(--teal);font-size:26px}
.tn-note{display:flex;align-items:center;gap:10px;margin:4px 0 0;font-size:19px;color:var(--ink-2);background:var(--surface);border-radius:12px;padding:10px 14px}
.tn-note .ic{width:24px;height:24px;color:var(--ink-3)}
.fn-r{display:flex;flex-direction:column;gap:18px;justify-content:center;min-width:0}
.nw{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:20px 24px;box-shadow:var(--card-sh)}
.nw-ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c)}
.nw-ic .ic{width:28px;height:28px}
.nw b{display:block;font-size:27px;font-weight:800;letter-spacing:-.02em}
.nw span{font-size:20px;color:var(--ink-2)}
.fn-bottom{display:flex;gap:14px;align-items:center;margin-top:10px;background:var(--navy);color:#fff;border-radius:16px;padding:20px 24px;font-size:22px;font-weight:700;line-height:1.4}
.fn-bottom .ic{flex:none;width:28px;height:28px;color:var(--mint)}

/* 4장 6단계 */
.stagesb{gap:14px}
.sg-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.sg-g{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--c);font-size:21px;font-weight:800}
.sg-g i{display:block;width:100%;height:10px;border:2.5px solid var(--c);border-bottom:0;border-radius:8px 8px 0 0}
.sg-row{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px;flex:1;min-height:0}
.sg{position:relative;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:18px;padding:22px 20px;box-shadow:var(--card-sh);transition:opacity .3s,box-shadow .3s,transform .3s}
.sg-top{display:flex;justify-content:space-between;align-items:center}
.sg-n{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-size:22px;font-weight:700}
.sg-ic{color:var(--c);opacity:.5}
.sg-ic .ic{width:36px;height:36px}
.sg-name{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:6px}
.sg-act{align-self:flex-start;font-size:17px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 9%,white);border-radius:999px;padding:4px 12px}
.sg-goal{margin:auto 0 0;font-size:19px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.sg-arr{position:absolute;right:-22px;top:42px;width:22px;display:grid;place-items:center;color:var(--ink-3);z-index:2}
.sg-arr .ic{width:20px;height:20px}
.slide.has-hl .sg.hl{box-shadow:0 0 0 2px var(--c),0 22px 48px rgba(11,22,38,.14);transform:translateY(-4px)}

/* 5장 세부 절차 */
.detail{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center}
.dt-flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}

function loopSVG(s, base, centerKey, opt = {}) {
  const labels = getPath(s, base) || [], C = opt.colors || ["var(--c-blue)", "var(--c-violet)", "var(--c-teal)"];
  const icons = opt.icons || ["users", "sparkle", "refresh"];
  const P = [[300, 92], [470, 380], [130, 380]], r = 52;
  const arc = (a, b, k) => {
    const [x1, y1] = a, [x2, y2] = b, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    const sx = x1 + dx / L * (r + 18), sy = y1 + dy / L * (r + 18), ex = x2 - dx / L * (r + 22), ey = y2 - dy / L * (r + 22);
    const mx = (sx + ex) / 2, my = (sy + ey) / 2, cx = 300, cy = 285, ox = mx - cx, oy = my - cy, oL = Math.hypot(ox, oy);
    const qx = mx + ox / oL * 46, qy = my + oy / oL * 46;
    const f = opt.frag ? ` frag" data-f="${opt.fragAt(k)}` : "";
    return `<path class="lp-arc${f}" d="M${sx.toFixed(1)} ${sy.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" marker-end="url(#ah-${s.id})" style="--k:${k}"/>`;
  };
  const nodes = P.map(([x, y], k) => {
    const f = opt.frag ? ` frag" data-f="${opt.nodeAt(k)}` : "";
    const ly = k === 0 ? y - r - 22 : y + r + 40;
    return `<g class="lp-node${f}" style="--c:${C[k]};--k:${k}"><circle cx="${x}" cy="${y}" r="${r}" class="lp-c"/>
      <g transform="translate(${x - 21} ${y - 21}) scale(1.32)" class="lp-ic">${ICON[icons[k]] || ""}</g>
      <text x="${x}" y="${ly}" class="lp-t" data-k="${base}.${k}">${esc(labels[k] || "")}</text></g>`;
  }).join("");
  return `<svg class="loop ${opt.cls || ""}" viewBox="0 0 600 480" aria-hidden="true">
    <defs><marker id="ah-${s.id}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink-3)"/></marker></defs>
    <g class="lp-arcs">${arc(P[0], P[1], 0)}${arc(P[1], P[2], 1)}${arc(P[2], P[0], 2)}</g>
    <circle cx="300" cy="285" r="74" class="lp-hub"/>
    <text x="300" y="${opt.hubSize ? 293 : 296}" class="lp-center${opt.hubSize ? " sm" : ""}" data-k="${centerKey}">${esc(getPath(s, centerKey))}</text>
    ${nodes}
  </svg>`;
}
