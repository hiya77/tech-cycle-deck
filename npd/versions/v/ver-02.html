    [...COMMON_TOP, ...(SCHEMA[s.type] || SCHEMA.text), SRC_LIST, ...COMMON_BOTTOM].forEach(d => { const f = fieldFor(s, d); if (f) body.append(f); });
  } else if (mode.tab === "deck") renderDeckTab(body);
  else renderFileTab(body);
  body.scrollTop = keep;
}
function syncPanelField(path) {
  const inp = $(`#editBody [data-path="${CSS.escape(path)}"]`);
  const s = deck.slides[cur];
  if (inp && document.activeElement !== inp) inp.value = getPath(s, path) ?? "";
}
function renderDeckTab(body) {
  const total = deck.slides.reduce((a, x) => a + (+x.duration || 0), 0);
  body.append(el("div", { class: "hint" }, `슬라이드 ${deck.slides.length}장 · 발표 시간 합계 ${fmtTime(total)}`));
  const ul = el("ul", { class: "slide-list" });
  deck.slides.forEach((s, i) => {
    const del = el("button", { class: "icon-btn", title: "삭제", html: uiIcon("del") });
    del.addEventListener("click", () => {
      if (deck.slides.length <= 1) return toast("마지막 한 장은 삭제할 수 없습니다.");
      if (!del.classList.contains("confirm")) { del.classList.add("confirm"); del.title = "한 번 더 누르면 삭제"; toast("한 번 더 누르면 이 슬라이드를 삭제합니다."); setTimeout(() => { del.classList.remove("confirm"); del.title = "삭제"; }, 3000); return; }
      deck.slides.splice(i, 1); if (cur >= deck.slides.length) cur = deck.slides.length - 1; else if (i < cur) cur--;
      save(); renderAll(); renderEditor(); toast("슬라이드를 삭제했습니다.");
    });
    const mv = (dir) => () => { const j = i + dir; if (j < 0 || j >= deck.slides.length) return; const [x] = deck.slides.splice(i, 1); deck.slides.splice(j, 0, x); if (cur === i) cur = j; else if (cur === j) cur = i; save(); renderAll(); renderEditor(); };
    const dup = () => { const c = clone(s); c.id = uid(); deck.slides.splice(i + 1, 0, c); save(); cur = i + 1; renderAll(); renderEditor(); toast("슬라이드를 복제했습니다."); };
    ul.append(el("li", { class: i === cur ? "cur" : "" },
      el("span", { class: "n" }, pad(i + 1)),
      el("span", { class: "t", on: { click: () => { show(i, 0); renderEditor(); } }, title: "이 슬라이드로 이동" }, s.title || "(제목 없음)", el("small", {}, `${s.type} · ${fmtTime(+s.duration || 0)}`)),
      el("span", { class: "acts" },
        el("button", { class: "icon-btn", title: "위로", html: uiIcon("up"), on: { click: mv(-1) } }),
        el("button", { class: "icon-btn", title: "아래로", html: uiIcon("down"), on: { click: mv(1) } }),
        el("button", { class: "icon-btn", title: "복제", html: uiIcon("dup"), on: { click: dup } }),
        del)));
  });
  body.append(ul);
  body.append(el("div", { class: "group" }, el("div", { class: "group-title" }, "슬라이드 추가"),
    el("div", { class: "btn-row" },
      el("button", { class: "btn small solid", on: { click: () => {
        const s = { id: uid(), type: "text", duration: 30, title: "새 슬라이드", lead: "핵심 문구를 입력하세요", bullets: ["본문 항목을 입력하세요"], image: { src: "", fallback: "none", caption: "", credit: "" }, sources: [], script: "", notes: "" };
        deck.slides.splice(cur + 1, 0, s); cur = cur + 1; save(); renderAll(); mode.tab = "slide"; renderEditor(); toast("현재 슬라이드 뒤에 새 슬라이드를 추가했습니다.");
      } } }, "+ 텍스트 슬라이드를 현재 슬라이드 뒤에 추가"))));
}
function exportJSON() { return JSON.stringify({ format: "npd-deck", exportedAt: new Date().toISOString(), deck }, null, 2); }
function renderFileTab(body) {
  body.append(el("div", { class: "group-title" }, "발표 정보"));
  const ti = el("input", { id: "meta-title", type: "text" }); ti.value = deck.meta.deckTitle || "";
  ti.addEventListener("input", () => { deck.meta.deckTitle = ti.value; $("#brandTitle").textContent = ti.value; save(); });
  body.append(el("div", { class: "fld" }, el("label", { for: "meta-title" }, "상단 표시 제목"), ti));
  body.append(el("p", { class: "hint" }, "수정 내용은 이 브라우저에 자동 저장되어 새로고침해도 유지됩니다. 다른 컴퓨터로 옮기려면 JSON으로 내보내세요."));

  const g1 = el("div", { class: "group" }, el("div", { class: "group-title" }, "JSON 내보내기"));
  const ta = el("textarea", { class: "json-box", id: "json-out", readonly: "readonly", rows: 6 }); ta.value = exportJSON();
  g1.append(ta, el("div", { class: "btn-row" },
    el("button", { class: "btn small solid", on: { click: () => {
      ta.value = exportJSON();
      const done = () => toast("JSON을 복사했습니다. 메모장 등에 붙여 넣어 .json 파일로 보관하세요.");
      try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast("복사가 막혀 있어 내용을 선택해 두었습니다. Ctrl+C로 복사하세요."); }); }
      catch (e) { ta.select(); toast("내용을 선택해 두었습니다. Ctrl+C로 복사하세요."); }
    } } }, "JSON 복사"),
    el("button", { class: "btn small solid", on: { click: () => {
      try {
        const blob = new Blob([exportJSON()], { type: "application/json" });
        const a = el("a", { href: URL.createObjectURL(blob), download: "npd-deck.json" }); document.body.append(a); a.click(); a.remove();
        toast("파일 저장을 시작했습니다. 저장이 안 되면 'JSON 복사'를 쓰세요.");
      } catch (e) { toast("파일 저장이 막혀 있습니다. 'JSON 복사'를 쓰세요."); }
    } } }, "파일로 저장")));
  body.append(g1);

  const g2 = el("div", { class: "group" }, el("div", { class: "group-title" }, "JSON 불러오기"));
  const fi = el("input", { type: "file", accept: "application/json,.json", id: "json-file" });
  const pa = el("textarea", { class: "json-box", id: "json-in", rows: 5, placeholder: "내보낸 JSON을 여기에 붙여 넣으세요" });
  const apply = txt => {
    try {
      const o = JSON.parse(txt); const d = o && o.deck ? o.deck : o;
      if (!validDeck(d)) throw new Error("bad");
      d.meta = d.meta || {}; d.slides.forEach(s => { if (!s.id) s.id = uid(); });
      deck = d; cur = 0; step = 0; save(); renderAll(); renderEditor(); toast("불러왔습니다. 슬라이드 " + d.slides.length + "장.");
    } catch (e) { toast("불러오지 못했습니다. 이 사이트에서 내보낸 JSON인지 확인하세요."); }
  };
  fi.addEventListener("change", () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => apply(r.result); r.readAsText(f); });
  g2.append(el("div", { class: "fld" }, el("label", { for: "json-file" }, "JSON 파일 선택"), fi), pa,
    el("div", { class: "btn-row" }, el("button", { class: "btn small solid", on: { click: () => apply(pa.value) } }, "붙여 넣은 JSON 불러오기")));
  body.append(g2);

  const g3 = el("div", { class: "group" }, el("div", { class: "group-title" }, "초기 상태로 되돌리기"));
  const rb = el("button", { class: "btn small danger solid", on: { click: () => {
    g3.querySelector(".confirm-box").hidden = false; rb.hidden = true;
  } } }, "초기 상태로 되돌리기…");
  const cb = el("div", { class: "confirm-box", hidden: "hidden" },
    el("span", {}, "모든 수정 내용이 지워지고 처음 받은 9장 상태로 돌아갑니다. 필요하면 먼저 JSON으로 내보내세요."),
    el("div", { class: "btn-row" },
      el("button", { class: "btn small danger solid", on: { click: () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} deck = clone(DEFAULT_DECK); cur = 0; step = 0; save(); renderAll(); renderEditor(); toast("초기 상태로 되돌렸습니다."); } } }, "되돌리기"),
      el("button", { class: "btn small solid", on: { click: () => { cb.hidden = true; rb.hidden = false; } } }, "취소")));
  g3.append(rb, cb);
  body.append(g3);
  if (!storageOK) body.append(el("p", { class: "hint" }, "이 브라우저는 저장 공간을 막고 있어 새로고침하면 수정 내용이 사라집니다. JSON으로 내보내 보관하세요."));
}

/* ================= 모드 전환 ================= */
function setEdit(on) {
  mode.edit = on;
  if (on) { setPresent(false); mode.notes = false; }
  document.body.classList.toggle("editing", on);
  $("#btnEdit").setAttribute("aria-pressed", String(on));
  $("#modeChip").textContent = on ? "편집 모드" : "보기 모드";
  $("#editPanel").hidden = !on;
  syncDrawers();
  applyEditable();
  const el = slideEl(cur); if (el) { el.classList.remove("play"); applyStep(el); }
  if (on) renderEditor();
  fit();
}
function syncDrawers() {
  $("#notesPanel").hidden = !mode.notes || mode.present;
  $("#btnNotes").setAttribute("aria-pressed", String(mode.notes));
  $("#editPanel").hidden = !mode.edit || mode.present;
  $("#scriptBar").hidden = !mode.script;
  $("#btnScript").setAttribute("aria-pressed", String(mode.script));
  requestAnimationFrame(fit);
}
function setPresent(on) {
  if (on && mode.edit) setEdit(false);
  mode.present = on;
  document.body.classList.toggle("presenting", on);
  syncDrawers();
  if (on) { flashCtrl(); toast("발표 모드 · 방향키·스페이스·엔터로 넘기고, Esc로 끝냅니다.", 2600); }
}
let ctrlTimer;
function flashCtrl() { if (!mode.present) return; document.body.classList.add("show-ctrl"); clearTimeout(ctrlTimer); ctrlTimer = setTimeout(() => document.body.classList.remove("show-ctrl"), 2200); }
function toggleFull() {
  try {
    if (!document.fullscreenElement) { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => toast("이 화면에서는 전체 화면을 열 수 없습니다. 브라우저에서 파일을 직접 열어 보세요.")); }
    else document.exitFullscreen();
  } catch (e) { toast("이 화면에서는 전체 화면을 열 수 없습니다."); }
}
function doPrint() {
  const wasEdit = mode.edit; if (wasEdit) setEdit(false);
  toast("인쇄 창이 열리지 않으면 HTML 파일을 브라우저에서 직접 열어 인쇄하세요. 가로 방향, 배경 그래픽 켜기를 권장합니다.", 6000);
  setTimeout(() => { try { window.print(); } catch (e) {} }, 60);
}

$("#btnEdit").addEventListener("click", () => setEdit(!mode.edit));
$("#btnScript").addEventListener("click", () => { mode.script = !mode.script; syncDrawers(); });
$("#btnNotes").addEventListener("click", () => { mode.notes = !mode.notes; if (mode.notes && mode.edit) setEdit(false); syncDrawers(); renderNotes(); });
$("#btnPresent").addEventListener("click", () => setPresent(true));
$("#exitPresent").addEventListener("click", () => setPresent(false));
$("#btnFull").addEventListener("click", toggleFull);
$("#btnPrint").addEventListener("click", doPrint);
$$("[data-close]").forEach(b => b.addEventListener("click", () => { if (b.dataset.close === "edit") setEdit(false); else { mode.notes = false; syncDrawers(); } }));
$$(".tab").forEach(t => t.addEventListener("click", () => { mode.tab = t.dataset.tab; renderEditor(); }));
$("#prev").addEventListener("click", prev);
$("#next").addEventListener("click", next);
$("#progress").addEventListener("click", e => { const s = e.target.closest("[data-go]"); if (s) show(+s.dataset.go, 0); });
document.addEventListener("mousemove", flashCtrl);
document.addEventListener("fullscreenchange", () => requestAnimationFrame(fit));

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) { if (e.key === "Escape") t.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case "Enter": if (t && /^(BUTTON|A)$/.test(t.tagName)) return;
    case "ArrowRight": case "PageDown": case " ": case "Spacebar": e.preventDefault(); next(); flashCtrl(); break;
    case "ArrowLeft": case "PageUp": e.preventDefault(); prev(); flashCtrl(); break;
    case "Home": show(0, 0); break;
    case "End": show(deck.slides.length - 1, "end"); break;
    case "f": case "F": toggleFull(); break;
    case "s": case "S": mode.script = !mode.script; syncDrawers(); break;
    case "n": case "N": mode.notes = !mode.notes; if (mode.notes && mode.edit) setEdit(false); syncDrawers(); renderNotes(); break;
    case "p": case "P": setPresent(!mode.present); break;
    case "e": case "E": setEdit(!mode.edit); break;
    case "Escape": if (mode.present) setPresent(false); break;
  }
});
let tx = null, ty = null;
$("#viewport").addEventListener("touchstart", e => { if (mode.edit) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#viewport").addEventListener("touchend", e => {
  if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? next() : prev();
});
window.addEventListener("beforeprint", () => { $$(".slide", stage).forEach(s => s.classList.add("show-all")); });
window.addEventListener("afterprint", () => { $$(".slide", stage).forEach((s, k) => { if (k !== cur || !mode.edit) s.classList.remove("show-all"); }); applyStep(slideEl(cur)); });

/* ================= 시작 ================= */
deck = load();
deck.meta = deck.meta || {};
const h = parseInt((location.hash || "").replace("#", ""), 10);
cur = isFinite(h) ? Math.max(0, Math.min(deck.slides.length - 1, h - 1)) : 0;
renderAll();
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
window.__deck = { get state() { return deck; }, show, next, prev, setEdit };
})();
</script>
</body></html>
