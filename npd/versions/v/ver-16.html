/* 사례 장 */
.c10{display:grid;grid-template-columns:.95fr 1.25fr;grid-template-rows:1fr auto;gap:18px 28px}
.c10.noph{grid-template-columns:1fr}
.c10-ph{position:relative;border-radius:22px;overflow:hidden;background:var(--surface);min-height:0}
.c10-phi{position:absolute;inset:0}.c10-phi img{width:100%;height:100%;object-fit:cover}
.c10-cap{position:absolute;left:14px;bottom:12px;padding:5px 12px;border-radius:8px;background:rgba(11,22,38,.72);color:#fff;font-size:14px}
.c10-r{display:flex;flex-direction:column;gap:12px;min-height:0}
.c10-legend{display:flex;gap:20px;font-size:16px;color:var(--ink-2)}
.c10-legend .lg{display:flex;align-items:center;gap:8px}
.c10-legend .lg::before{content:"";width:22px;height:14px;border-radius:4px}
.c10-legend .fact::before{background:#fff;border:1.5px solid var(--line-2)}
.c10-legend .int::before{border:1.5px dashed var(--kw);background:var(--kw-soft)}
.c10-row{display:flex;gap:18px;align-items:stretch;padding:16px 20px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px -26px rgba(15,26,44,.45);flex:1;min-height:0}
.slide:not(.show-all) .c10-row.frag:not(.on){transform:translateX(34px)}
.c10-st{flex:none;width:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;border-radius:14px;background:var(--accent);color:#fff;text-align:center}
.c10-st b{font:800 40px/1 var(--font-display)}
.c10-st span{font-size:19px;font-weight:800;letter-spacing:-.03em}
.c10-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.c10-f{display:flex;gap:14px;align-items:baseline}
.c10-f i{flex:none;font-style:normal;font:700 17px var(--font-mono);color:var(--accent)}
.c10-f span{font-size:23px;line-height:1.38;color:var(--ink);letter-spacing:-.015em}
.c10-body small{font-size:14px;color:var(--ink-3)}
.c10-int{margin:2px 0 0;display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-radius:10px;border:1.5px dashed var(--kw);background:var(--kw-soft);font-size:18px;color:var(--ink)}
.c10-int em{flex:none;font-style:normal;font-size:13px;font-weight:800;color:var(--kw)}
.c10-bottom{grid-column:1/-1;display:flex;gap:14px;align-items:center;padding:16px 24px;border-radius:16px;background:var(--navy);color:#fff;font-size:23px;font-weight:700}
.c10-bottom svg{flex:none;width:24px;height:24px;color:var(--mint)}
.c10-bottom em.kw{color:var(--kw-dark)}

/* ===== v11: B 다크 키노트 ===== */
.slide{--bg:#0B0F17;--ink:#F4F6FA;--ink-2:#B4BCCB;--ink-3:#8790A1;--line:rgba(255,255,255,.12);--line-2:rgba(255,255,255,.22);
  --surface:rgba(255,255,255,.05);--raise:rgba(255,255,255,.08);--accent:#5B9BFF;--accent-ink:#5B9BFF;--accent-soft:rgba(91,155,255,.16);
  --navy:rgba(91,155,255,.14);--mint:#5B9BFF;--kw:#FFB547;--kw-soft:rgba(255,181,71,.14);--kw-dark:#FFB547;--red:#FFB547;
  --fact:rgba(255,255,255,.05);--fact-line:rgba(255,255,255,.14);--card:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  background:radial-gradient(120% 120% at 0 0,#172235 0,#0B0F17 60%)!important;color:var(--ink);color-scheme:dark}
.stage{background:#0B0F17}
.eyebrow{color:var(--ink-2)}
.eyebrow .no{color:var(--accent);border:1px solid var(--line-2);border-radius:99px}
.eyebrow [data-k]{color:var(--ink-2)}
.lead{color:var(--ink)}
.s-foot{border-top-color:var(--line);color:var(--ink-3)}
/* 키워드: 색만, 밑줄 형광 없음 */
em.kw{color:var(--kw)!important;background:none!important;font-weight:800;padding:0;animation:none!important}
.slide.play em.kw{animation:kwGlow 1s ease .5s both!important}
@keyframes kwGlow{from{color:var(--ink)}to{color:var(--kw)}}

/* 카드 공통 */
.st2-p,.t10-row li,.c10-row,.f9-row li,.cn2-p,.cn2-w,.r9-g,.t9-list li,.st2-ex{background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:none!important}
/* 바닥 강조 줄 */
.st2-bottom,.cn3-final,.c10-bottom{background:rgba(91,155,255,.14)!important;border:1px solid rgba(91,155,255,.4)!important;color:var(--ink)!important}
.st2-bottom>svg,.cn3-final svg,.c10-bottom svg{color:var(--accent)!important}
.st2-bottom small{color:var(--ink-3)}

/* 6단계 한눈에 */
.f9-row li{border-top:1px solid var(--line)!important}
.f9-n{background:var(--accent);color:#0B0F17;border-radius:16px;font-family:var(--font-mono)}

.f9-note{background:var(--surface);border:1px solid var(--line)}

/* 단계 설명 */
.st2-p{border-left:1px solid var(--line)!important;border-radius:24px}
.st2-n{background:var(--accent);color:#0B0F17;border-radius:16px;font-family:var(--font-mono)}
.st2-ic{color:var(--accent)}
.st2-tag{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.st2-t th{color:var(--ink-3);border-bottom-color:var(--line)}
.st2-t td{border-bottom-color:var(--line);color:var(--ink)}
.st2-t td:first-child{color:var(--accent)}

/* 목차 */
.t10-n{color:var(--accent);font-family:var(--font-mono)}
.t10-ic{background:var(--accent-soft);color:var(--accent)}
.t10-bar{background:var(--accent)}
.t10-row li.cs{background:linear-gradient(160deg,rgba(255,181,71,.12),rgba(255,255,255,.02))!important;border-color:rgba(255,181,71,.35)!important}
.t10-row li.cs .t10-n{color:var(--kw)}
.t10-row li.cs .t10-ic{background:var(--kw-soft);color:var(--kw)}
.t10-row li.cs .t10-bar{background:var(--kw)}

/* 사례 */
.c10-ph{border-radius:24px;border:1px solid var(--line)}
.c10-st{background:var(--accent);color:#0B0F17}
.c10-f i{color:var(--accent)}
.c10-int{border:0;border-left:3px solid var(--kw);border-radius:6px;background:var(--kw-soft);color:var(--ink)}
.c10-int em{color:var(--kw)}
.c10-legend .fact::before{background:var(--surface);border:1px solid var(--line-2)}
.c10-legend .int::before{border:0;border-left:3px solid var(--kw);background:var(--kw-soft)}

/* 결론 */
.cn2-p{border-top:1px solid var(--line)!important}
.cn2-p b{color:var(--accent)!important}
.cn2-w .cn2-t{color:var(--ink)!important}
.cn3-src{background:var(--surface)!important;border:1px solid var(--line)!important;color:var(--ink-2)!important}

/* 출처 */
.r9-h em{background:var(--accent);color:#0B0F17}
.r9-g.cs{background:linear-gradient(160deg,rgba(255,181,71,.10),rgba(255,255,255,.02))!important;border-color:rgba(255,181,71,.3)!important}
.r9-g.cs .r9-h em{background:var(--kw);color:#0B0F17;border:0}
.r9-g li a{color:var(--ink-3)}
.r9-note svg{color:var(--kw)}

/* 표지 (B: 전면 사진 + 왼쪽 그늘) */
.c9d{background:radial-gradient(120% 120% at 0 0,#172235 0,#0B0F17 60%)}

.c9d.has-ph .c9d-shade{background:linear-gradient(90deg,#0B0F17 0%,rgba(11,15,23,.88) 34%,rgba(11,15,23,.25) 62%,rgba(11,15,23,0) 80%),linear-gradient(0deg,rgba(11,15,23,.7),rgba(11,15,23,0) 35%)}

.c9-empty,.c10-ph .ph-empty{border-color:var(--line-2);color:var(--ink-3)}
/* 등장 애니메이션 보강 */
.slide.play .st2-p,.slide.play .f9-row li,.slide.play .t10-row li,.slide.play .cn2-p,.slide.play .r9-g{animation:upIn .7s cubic-bezier(.2,.7,.2,1) both}
.slide.play .st2-p:nth-child(2),.slide.play .r9-g:nth-child(2){animation-delay:.15s}

.slide.play .f9-row li:nth-child(2),.slide.play .t10-row li:nth-child(2){animation-delay:.2s}
.slide.play .f9-row li:nth-child(3),.slide.play .t10-row li:nth-child(3){animation-delay:.3s}
.slide.play .f9-row li:nth-child(4),.slide.play .t10-row li:nth-child(4){animation-delay:.4s}

.slide.play .c9d-sub{animation-delay:.2s}.slide.play .c9d-steps{animation-delay:.4s}

@keyframes upIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* 결론 연결선: 단색 + 다시 움직이게 */
.cn2-fill{background:var(--accent)!important}

/* 02 혁신의 터널: 아이디어 입자가 흘러 들어가 대부분 사라지고 하나만 빠져나온다 */
R.funnel = (s, i) => {

    const endY = win ? 120 : yAt(endX, y0) + (rnd1(k + 90) > .5 ? 1 : -1) * (18 + rnd1(k + 7) * 34);
    const midX = (10 + endX) / 2, d = `M-10 ${y0.toFixed(0)} Q${midX.toFixed(0)} ${yAt(midX, y0).toFixed(0)} ${endX.toFixed(0)} ${endY.toFixed(0)}`;
    const dur = ((win ? 4.2 : 2.6) + rnd1(k + 3) * 1.4).toFixed(2), beg = (rnd1(k + 11) * 4.5).toFixed(2);
    parts += `<circle r="${win ? 6.5 : 4}" class="tn-p${win ? " win" : ""}" opacity="0"><animateMotion dur="${dur}s" begin="${beg}s" repeatCount="indefinite" path="${d}"/><animate attributeName="opacity" dur="${dur}s" begin="${beg}s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;${win ? ".9;.98" : ".62;.8"};1"/></circle>`;
  }
  return `${head(s, i)}<div class="s-body funnel2">

/* 02 캐즘: 강의자료 42장 기술의 확산 곡선을 다시 그림 */
R.chasm = (s, i) => {
  const seg = s.segs || [], G = 64, x0 = 40, x1 = 1000 - 40 - G, sd = (x1 - x0) / 6.4;
  const X = z => x0 + (z + 3.2) * sd + (z > -1 ? G : 0), base = 300, K = 600;
  const pdf = z => Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI);
  const cuts = [-3.2, -2, -1, 0, 1, 3.2];
  const segPath = k => { const a = cuts[k], b = cuts[k + 1]; let d = `M${X(a + (k === 2 ? 0.0001 : 0)).toFixed(1)} ${base}`;
    for (let z = a; z <= b + 1e-9; z += 0.05) { const zz = Math.min(z, b); d += ` L${X(k === 2 && zz <= -1 ? -0.9999 : zz).toFixed(1)} ${(base - pdf(zz) * K).toFixed(1)}`; }
    return d + ` L${X(b).toFixed(1)} ${base} Z`; };
  const fills = ["var(--c-violet)", "var(--c-blue)", "var(--c-teal)", "var(--c-orange)", "var(--c-coral)"];
  const cx = X(-1) + G / 2;
  let cum = ""; for (let z = -3.2; z <= 3.2; z += 0.1) { const c = 0.5 * (1 + erf1(z / Math.SQRT2)); cum += `${cum ? " L" : "M"}${X(z).toFixed(1)} ${(base - 30 - c * 230).toFixed(1)}`; }
  return `${head(s, i)}<div class="s-body chasm">
  <div class="cz-wrap rise"${rise(1)}>
    <svg class="cz-svg" viewBox="0 0 1000 380" aria-hidden="true">
      <path class="cz-cum" d="${cum}" pathLength="1"/>
      <g class="cz-left">${[0, 1].map(k => `<path class="cz-seg" d="${segPath(k)}" style="--c:${fills[k]};--k:${k}"/>`).join("")}</g>
      <g class="cz-right">${[2, 3, 4].map(k => `<path class="cz-seg" d="${segPath(k)}" style="--c:${fills[k]};--k:${k}"/>`).join("")}</g>
      <line x1="30" x2="970" y1="${base}" y2="${base}" class="cz-axis"/>
      <g class="cz-gap"><rect x="${(cx - G / 2 + 6).toFixed(1)}" y="40" width="${G - 12}" height="${base - 36}" class="cz-gaprect"/>
        <path class="cz-crack" d="M${cx} 40 l-8 40 l12 30 l-10 38 l10 40 l-8 44 l6 70" pathLength="1"/>
        <text x="${cx}" y="34" class="cz-gt">THE CHASM</text></g>
    </svg>
    <div class="cz-labels">${seg.map((g, k) => { const a = X(cuts[k] + (k === 2 ? 0.0001 : 0)), b = X(cuts[k + 1]);
      return `<div class="cz-lb${k < 2 ? " l" : " r"}" style="left:${(a / 10).toFixed(2)}%;width:${((b - a) / 10).toFixed(2)}%;--c:${fills[k]};--k:${k}">
        <b><span data-count="${+g.p}" data-dec="${String(g.p).includes(".") ? 1 : 0}" data-delay="${600 + k * 260}">${esc(g.p)}</span>%</b><span class="en" data-k="segs.${k}.en">${esc(g.en)}</span><span class="ko" data-k="segs.${k}.ko">${esc(g.ko)}</span></div>`; }).join("")}</div>
    <div class="cz-fail frag" data-f="1">
      <b class="cz-ft">${icon("down")}<span data-k="fail.h">${esc((s.fail || {}).h)}</span></b>
      <div class="cz-ex">${((s.fail || {}).ex || []).map((e, k) => `<figure>${photo(s, `fail.ex.${k}.img`, "cz-exph")}<figcaption data-k="fail.ex.${k}.name">${esc(e.name)}</figcaption></figure>`).join("")}</div>
      <span class="cz-fs" data-k="fail.src">${esc((s.fail || {}).src || "")}</span>
    </div>
    <div class="cz-ok frag" data-f="1"><b>${icon("star")}<span data-k="okLabel">${esc(s.okLabel)}</span></b></div>
    <span class="cz-chasm-lb frag" data-f="1" style="left:${(cx / 10).toFixed(2)}%" data-k="chasmLabel">${esc(s.chasmLabel)}</span>
  </div>
  <div class="cz-bottom frag" data-f="2">${icon("arrow")}${ed(s, "bottom", "span")}</div>
</div>${foot(s, i)}`;
};
function erf1(x) { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; }

R.foldgen = (s, i) => {

  const first = M[0] || {}, last = M[n - 1] || {}, pct = first.v ? Math.round((1 - last.v / first.v) * 100) : 0;

function renderSlide(id) {

  if (i < 0 || !old) return renderAll();

/* 핵심 키워드: 데이터의 [[낱말]]을 보기 모드에서 강조색으로 (편집 모드에서는 괄호째 보여 고칠 수 있게) */
function applyKw(root) {
  if (mode.edit) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.includes("[[") ? 1 : 2 });
  const list = []; while (tw.nextNode()) list.push(tw.currentNode);
  list.forEach(n => {
    const svg = n.parentNode.namespaceURI === "http://www.w3.org/2000/svg";
    const frag = document.createDocumentFragment();
    n.nodeValue.split(/(\[\[.+?\]\])/).forEach(part => {
      const m = /^\[\[(.+)\]\]$/.exec(part);
      if (!m) { if (part) frag.appendChild(document.createTextNode(part)); return; }
      const k = svg ? document.createElementNS("http://www.w3.org/2000/svg", "tspan") : document.createElement("em");
      k.setAttribute("class", "kw"); k.textContent = m[1]; frag.appendChild(k);
    });
    n.parentNode.replaceChild(frag, n);
  });
}
function applyEditable(root = stage) {
  $$("[data-k]", root).forEach(el => {
    if (mode.edit) {
      el.contentEditable = "plaintext-only";
      if (el.contentEditable !== "plaintext-only") el.contentEditable = "true";
      el.spellcheck = false;
    } else el.removeAttribute("contenteditable");
  });
}

/* ================= 이동·단계 ================= */
function slideEl(i) { return stage.children[i]; }
function applyStep(el) {
  const s = deck.slides[cur];
  const showAll = mode.edit;
  el.classList.toggle("show-all", showAll);
  $$(".frag", el).forEach(f => f.classList.toggle("on", showAll || +f.dataset.f <= step));
  const hlOn = !showAll && step > 0 && ["stages", "case", "evolve"].includes(s.type);
  el.classList.toggle("has-hl", hlOn);
  $$(".hl-item", el).forEach(h => h.classList.toggle("hl", hlOn && +h.dataset.hl === step));
  stepHook(el, s);
  updateChrome();
}
function runCounts(el) {
  $$("[data-count]", el).forEach(n => {
    const target = +n.dataset.count, delay = +n.dataset.delay || 0;
    const fmt = v => n.dataset.dec ? v.toFixed(+n.dataset.dec) : target >= 1 ? Math.round(v).toLocaleString("ko-KR") : v.toFixed(2);
    if (reduceMotion() || mode.edit || !isFinite(target)) { n.textContent = fmt(target); return; }
    n.textContent = fmt(0);
    const dur = 700, t0 = performance.now() + delay;
    const tick = now => {
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      n.textContent = fmt(target * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
function show(i, st = 0, opt = {}) {
  const n = deck.slides.length;
  i = Math.max(0, Math.min(n - 1, i));
  const prevI = cur;
  cur = i;
  step = st === "end" ? steps(deck.slides[i]) : Math.max(0, Math.min(steps(deck.slides[i]), st));
  $$(".slide", stage).forEach((el, k) => {
    el.classList.toggle("from-left", k < i);
    if (k !== i) el.classList.remove("is-active", "play");
  });
  const el = slideEl(i);
  if (!el) return;
  const entering = !el.classList.contains("is-active") || opt.instant;
  el.classList.add("is-active");
  applyStep(el);
  if (entering && !mode.edit && !reduceMotion()) { el.classList.remove("play"); void el.offsetWidth; el.classList.add("play"); runCounts(el); }
  else if (entering) { el.classList.remove("play"); runCounts(el); }
  try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  if (mode.edit && (prevI !== i || opt.instant)) renderEditor();
  renderNotes();
}
function next() { const s = deck.slides[cur]; if (!mode.edit && step < steps(s)) { step++; applyStep(slideEl(cur)); } else if (cur < deck.slides.length - 1) show(cur + 1, 0); }
function prev() { if (!mode.edit && step > 0) { step--; applyStep(slideEl(cur)); } else if (cur > 0) show(cur - 1, mode.edit ? 0 : "end"); }

function updateChrome() {
  const n = deck.slides.length, s = deck.slides[cur];
  $("#counter").innerHTML = `<b>${pad(cur + 1)}</b> / ${pad(n)}`;
  $("#prev").disabled = cur === 0 && step === 0;
  $("#next").disabled = cur === n - 1 && step >= steps(s);
  const total = deck.slides.reduce((a, x) => a + (+x.duration || 0), 0);
  const before = deck.slides.slice(0, cur).reduce((a, x) => a + (+x.duration || 0), 0);
  const prog = $("#progress");
  if (prog.children.length !== n) prog.innerHTML = deck.slides.map((_, k) => `<span class="seg" data-go="${k}" title="${k + 1}번 슬라이드로 이동"><i></i></span>`).join("");
  deck.slides.forEach((x, k) => {
    const seg = prog.children[k];
    seg.style.flexGrow = Math.max(1, +x.duration || 1);
    const st = steps(x);
    const frac = k < cur ? 1 : k > cur ? 0 : (st ? (step + 1) / (st + 1) : 1);
    seg.firstElementChild.style.width = (frac * 100) + "%";
  });
  const pct = total ? Math.round(((before + (+s.duration || 0) * (steps(s) ? (step + 1) / (steps(s) + 1) : 1)) / total) * 100) : 0;
  prog.setAttribute("aria-valuenow", pct);
  prog.title = "발표 진행률 " + pct + "%";
  const t = $("#timer");
  t.textContent = `${fmtTime(before)}–${fmtTime(before + (+s.duration || 0))} · 합계 ${fmtTime(total)}`;
  t.classList.toggle("bad", false);
  t.title = "목표 발표 시간 합계 " + fmtTime(total);
  // 대본
  $("#scriptHead").textContent = `발표 대본 · ${pad(cur + 1)} ${s.title || ""} · ${fmtTime(+s.duration || 0)}`;
  const st = $("#scriptText");
  if (document.activeElement !== st) st.textContent = s.script || "";
  if (mode.edit) { st.contentEditable = "plaintext-only"; if (st.contentEditable !== "plaintext-only") st.contentEditable = "true"; } else st.removeAttribute("contenteditable");
}
function renderNotes() {
  if (!mode.notes) return;
  const s = deck.slides[cur], nx = deck.slides[cur + 1];
  $("#notesBody").innerHTML = `<div class="notes-title">${pad(cur + 1)} · ${esc(s.title)} · ${fmtTime(+s.duration || 0)}</div>
    <div class="notes-text">${esc(s.notes || "메모 없음")}</div>

}

function fit() {
  const vp = $("#viewport");
  const cs = getComputedStyle(vp);
  const w = vp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = vp.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const sc = Math.max(0.05, Math.min(w / 1600, h / 900));
  const wrap = $("#stageWrap");
  wrap.style.width = (1600 * sc) + "px"; wrap.style.height = (900 * sc) + "px";
  stage.style.transform = `scale(${sc})`;
}
new ResizeObserver(fit).observe($("#viewport"));

}
function doPrint() {
  const wasEdit = mode.edit; if (wasEdit) setEdit(false);
  toast("인쇄 창이 열리지 않으면 HTML 파일을 브라우저에서 직접 열어 인쇄하세요. 가로 방향, 배경 그래픽 켜기를 권장합니다.", 6000);
  setTimeout(() => { try { window.print(); } catch (e) {} }, 60);
}

$("#btnEdit").addEventListener("click", () => setEdit(!mode.edit));
$("#btnScript").addEventListener("click", () => { mode.script = !mode.script; syncDrawers(); });
$("#btnNotes").addEventListener("click", () => { mode.notes = !mode.notes; if (mode.notes && mode.edit) setEdit(false); syncDrawers(); renderNotes(); });
$("#btnPresent").addEventListener("click", () => setPresent(true));
$("#exitPresent").addEventListener("click", () => setPresent(false));
$("#btnFull").addEventListener("click", toggleFull);
$("#btnPrint").addEventListener("click", doPrint);
$$("[data-close]").forEach(b => b.addEventListener("click", () => { if (b.dataset.close === "edit") setEdit(false); else { mode.notes = false; syncDrawers(); } }));
$$(".tab").forEach(t => t.addEventListener("click", () => { mode.tab = t.dataset.tab; renderEditor(); }));
$("#prev").addEventListener("click", prev);
$("#next").addEventListener("click", next);
$("#progress").addEventListener("click", e => { const s = e.target.closest("[data-go]"); if (s) show(+s.dataset.go, 0); });
document.addEventListener("mousemove", flashCtrl);
document.addEventListener("fullscreenchange", () => requestAnimationFrame(fit));

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) { if (e.key === "Escape") t.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case "Enter": if (t && /^(BUTTON|A)$/.test(t.tagName)) return;
    case "ArrowRight": case "PageDown": case " ": case "Spacebar": e.preventDefault(); next(); flashCtrl(); break;
    case "ArrowLeft": case "PageUp": e.preventDefault(); prev(); flashCtrl(); break;
    case "Home": show(0, 0); break;
    case "End": show(deck.slides.length - 1, "end"); break;
    case "f": case "F": toggleFull(); break;
    case "s": case "S": mode.script = !mode.script; syncDrawers(); break;
    case "n": case "N": mode.notes = !mode.notes; if (mode.notes && mode.edit) setEdit(false); syncDrawers(); renderNotes(); break;
    case "p": case "P": setPresent(!mode.present); break;
    case "e": case "E": setEdit(!mode.edit); break;
    case "Escape": if (mode.present) setPresent(false); break;
  }
});
let tx = null, ty = null;
$("#viewport").addEventListener("touchstart", e => { if (mode.edit) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#viewport").addEventListener("touchend", e => {
  if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? next() : prev();
});
window.addEventListener("beforeprint", () => { $$(".slide", stage).forEach(s => s.classList.add("show-all")); });
window.addEventListener("afterprint", () => { $$(".slide", stage).forEach((s, k) => { if (k !== cur || !mode.edit) s.classList.remove("show-all"); }); applyStep(slideEl(cur)); });

/* ================= 시작 ================= */
deck = load();
deck.meta = deck.meta || {};
const h = parseInt((location.hash || "").replace("#", ""), 10);
cur = isFinite(h) ? Math.max(0, Math.min(deck.slides.length - 1, h - 1)) : 0;
renderAll();
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
window.__deck = { get state() { return deck; }, show, next, prev, setEdit };
})();
</script>
</body></html>
