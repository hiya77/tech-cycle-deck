name: probe
on:
  push:
    paths: [".github/probe.sh"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: |
          mkdir -p probe
          bash .github/probe.sh || true
          ls -la probe
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe
          git diff --cached --quiet || git commit -m "Probe results"
          git pull --rebase && git push
