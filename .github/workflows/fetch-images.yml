name: fetch-images
on:
  push:
    paths: [".github/img-list.txt", ".github/workflows/fetch-images.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download slide photos
        run: |
          mkdir -p img
          while read -r f u; do
            [ -z "$f" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "$f" "$u" && echo "ok $f" || echo "FAIL $f $u"
          done < .github/img-list.txt
          ls -la img
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Store slide photos in the repository"
          git push
